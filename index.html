<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOS 명단관리 PRO</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes loading-bar { 0% { left: -40%; } 100% { left: 100%; } }
        .animate-loading-bar { position: relative; animation: loading-bar 2s infinite ease-in-out; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        body { background-color: #f0f9ff; margin: 0; padding: 0; font-family: sans-serif; overflow-x: hidden; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        const CONFIG = {
            GAS_URL: "https://script.google.com/macros/s/AKfycbcXcpXhhu8_ZDW0BaJetzVKnvJ1K7biHOhdGkba3Eds4h5UDOXEvY9vToE5B_8tezD8/exec", 
            API_KEY: "AIzaSyAgezV6j6tCs-7j39pA32FSVLgHy6rduFI", // 👈 유출되지 않은 새 키를 꼭 넣어주세요!
            MODEL_NAME: "gemini-2.5-flash" 
        };

        const Icon = ({ name, size = 18, className = "" }) => {
            const icons = {
                camera: <><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></>,
                clock: <><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>,
                trash: <><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></>,
                copy: <><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></>,
                settings: <><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></>,
                chevronLeft: <><path d="m15 18-6-6 6-6"/></>,
                check: <><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>
            };
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name]}
                </svg>
            );
        };

        const App = () => {
            const [view, setView] = useState('main'); 
            const [masterList, setMasterList] = useState([]);
            const [scannedData, setScannedData] = useState({ "12시": [], "18시": [], "21시": [] });
            const [activeTime, setActiveTime] = useState("12시");
            const [loading, setLoading] = useState(false);
            const [statusMsg, setStatusMsg] = useState("");
            const [isSyncing, setIsSyncing] = useState(false);
            const fileInputRef = useRef(null);

            useEffect(() => { fetchMasterData(); }, []);

            const fetchMasterData = async () => {
                setIsSyncing(true);
                try {
                    const response = await fetch(CONFIG.GAS_URL);
                    const data = await response.json();
                    setMasterList(data);
                } catch (e) { setStatusMsg("데이터 로드 실패"); }
                finally { setIsSyncing(false); }
            };

            const syncToSheet = async (updatedData) => {
                setIsSyncing(true);
                try {
                    await fetch(CONFIG.GAS_URL, { 
                        method: 'POST', 
                        mode: 'no-cors', // CORS 문제 우회
                        body: JSON.stringify(updatedData) 
                    });
                    setStatusMsg("시트 동기화 완료");
                } catch (e) { setStatusMsg("동기화 실패"); }
                finally { setIsSyncing(false); setTimeout(() => setStatusMsg(""), 2000); }
            };

            const runAI = async (e) => {
                const files = Array.from(e.target.files);
                if (!files.length) return;
                setLoading(true); setStatusMsg("2.5 엔진 분석 중...");
                
                let allNames = [];
                try {
                    for (let file of files) {
                        const base64 = await new Promise(res => {
                            const reader = new FileReader();
                            reader.onload = () => res(reader.result.split(',')[1]);
                            reader.readAsDataURL(file);
                        });

                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${CONFIG.MODEL_NAME}:generateContent?key=${CONFIG.API_KEY}`, {
                            method: "POST", headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ contents: [{ parts: [
                                { text: "이미지에서 닉네임만 추출해 JSON으로 줘: {\"names\": [\"닉네임1\"]}" },
                                { inlineData: { mimeType: "image/jpeg", data: base64 } }
                            ]}]})
                        });
                        const resData = await response.json();
                        const aiText = resData.candidates?.[0]?.content?.parts?.[0]?.text || "";
                        const jsonMatch = aiText.match(/\{.*\}/s);
                        if (jsonMatch) {
                            const parsed = JSON.parse(jsonMatch[0]);
                            if (parsed.names) allNames = [...allNames, ...parsed.names];
                        }
                    }

                    const processed = allNames.map(raw => {
                        const match = masterList.find(m => m.name === raw.trim()) || { name: raw.trim(), role: "미등록" };
                        return match;
                    });

                    setScannedData(prev => {
                        const combined = [...prev[activeTime], ...processed];
                        const unique = combined.filter((v, i, a) => a.findIndex(t => t.name === v.name) === i);
                        const next = { ...prev, [activeTime]: unique };
                        syncToSheet(next);
                        return next;
                    });
                } catch (err) { setStatusMsg("분석 오류"); }
                finally { setLoading(false); }
            };

            const copyToClipboard = () => {
                const list = scannedData[activeTime];
                const text = `[${activeTime} 참여명단]\n` + list.map((p, i) => `${i+1}. ${p.name} (${p.role})`).join('\n');
                navigator.clipboard.writeText(text);
                setStatusMsg("복사 완료!");
                setTimeout(() => setStatusMsg(""), 2000);
            };

            return (
                <div className="min-h-screen flex flex-col items-center p-4 relative">
                    <header className="w-full max-w-lg flex flex-col items-center mb-6 mt-4">
                        <div className="flex items-center gap-2 px-4 py-1 rounded-full bg-white border border-blue-200 shadow-sm mb-4">
                            <div className={`w-2 h-2 rounded-full ${isSyncing ? 'bg-amber-400' : 'bg-blue-500'}`} />
                            <span className="text-[10px] font-black text-blue-600 tracking-widest uppercase">
                                {isSyncing ? 'SYNCING...' : 'CONNECTED (2.5)'}
                            </span>
                        </div>
                        <h1 className="text-3xl font-black text-slate-900">WOS 명단 PRO <span className="text-blue-600">2.5 Engine</span></h1>
                    </header>

                    <nav className="w-full max-w-lg flex bg-white p-1 rounded-3xl border border-white shadow-sm mb-6">
                        {["12시", "18시", "21시"].map((time) => (
                            <button key={time} onClick={() => setActiveTime(time)} className={`flex-1 py-3 rounded-2xl text-sm font-black transition-all ${activeTime === time ? "bg-gradient-to-br from-blue-600 to-sky-500 text-white shadow-lg" : "text-slate-400"}`}>
                                {time}
                            </button>
                        ))}
                    </nav>

                    <main className="w-full max-w-lg space-y-6">
                        <div onClick={() => fileInputRef.current.click()} className="bg-white/70 backdrop-blur-2xl rounded-[2rem] border border-white shadow-xl p-8 flex flex-col items-center cursor-pointer hover:bg-white transition-all">
                            <input type="file" ref={fileInputRef} multiple onChange={runAI} className="hidden" />
                            <div className="w-16 h-16 bg-gradient-to-tr from-blue-500 to-sky-300 rounded-2xl flex items-center justify-center mb-4 text-white shadow-lg">
                                {loading ? <div className="animate-spin h-6 w-6 border-2 border-white border-t-transparent rounded-full"/> : <Icon name="camera" size={24}/>}
                            </div>
                            <h2 className="text-lg font-black text-slate-800">스크린샷 추가 스캔</h2>
                            <p className="text-xs text-slate-400 mt-1 font-bold tracking-tighter">자동 보정 & 실시간 저장 작동 중</p>
                        </div>

                        <div className="bg-white/80 rounded-[2rem] border border-white shadow-xl overflow-hidden min-h-[300px] flex flex-col">
                            <div className="p-5 border-b border-blue-50 flex justify-between items-center bg-blue-50/20">
                                <span className="text-xs font-black text-slate-700">{activeTime} 참여 명단 ({scannedData[activeTime].length}명)</span>
                                {statusMsg && <div className="text-[10px] font-bold text-blue-600 flex items-center gap-1 animate-bounce"><Icon name="check" size={12}/> {statusMsg}</div>}
                            </div>
                            <div className="flex-1 max-h-[400px] overflow-y-auto px-4 py-2 custom-scroll">
                                {scannedData[activeTime].length === 0 ? (
                                    <div className="py-20 flex flex-col items-center opacity-20"><Icon name="check" size={48} /><p className="text-xs mt-3 font-black">데이터가 없습니다</p></div>
                                ) : (
                                    <div className="space-y-2 py-2">
                                        {scannedData[activeTime].map((p, i) => (
                                            <div key={i} className="flex items-center justify-between p-3.5 bg-white border border-blue-50 rounded-2xl shadow-sm">
                                                <span className="text-[10px] font-black text-blue-300 w-4">{i + 1}</span>
                                                <span className="flex-1 text-sm font-black text-slate-800 ml-2">{p.name}</span>
                                                <span className={`text-[10px] font-black px-3 py-1 rounded-full ${p.role === '운영진' ? 'bg-amber-50 text-amber-600' : 'bg-blue-50 text-blue-600'}`}>{p.role}</span>
                                                <button onClick={() => {
                                                    const filtered = scannedData[activeTime].filter((_, idx) => idx !== i);
                                                    const next = {...scannedData, [activeTime]: filtered};
                                                    setScannedData(next); syncToSheet(next);
                                                }} className="ml-2 text-slate-300 hover:text-rose-500"><Icon name="trash" size={16}/></button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                            <div className="p-5 bg-blue-50/20 border-t border-blue-50">
                                <button onClick={copyToClipboard} className="w-full py-4 bg-gradient-to-r from-blue-600 to-sky-500 text-white rounded-2xl flex items-center justify-center gap-2 shadow-lg font-black active:scale-95 transition-all">
                                    <Icon name="copy" /> 명단 복사하기
                                </button>
                            </div>
                        </div>
                    </main>
                    <footer className="py-8 opacity-30 text-[10px] font-black text-blue-900">1953 GOM ALLIANCE PRO</footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
