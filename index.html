<script type="text/babel">
    const { useState, useEffect } = React;

    const CONFIG = {
        GAS_URL: "https://script.google.com/macros/s/AKfycbxM8qa36ZkYfNjHBDAcB9yQQHh7CESM4T5-B_n6pmHqGqxHiMyUxoH_igCrWHuKDU5m/exec",
        // ★ 여기에 새로 발급받은 API 키를 꼭 넣어주세요!
        API_KEY: "AIzaSyBMr9TxSCptoFno0nKiclVYLYxyn07HUrQ" 
    };

    function App() {
        const [masterList, setMasterList] = useState([]);
        const [scannedList, setScannedList] = useState([]);
        const [loading, setLoading] = useState(false);

        useEffect(() => {
            fetch(CONFIG.GAS_URL).then(r => r.json()).then(d => setMasterList(d)).catch(e => console.error("명단 로드 실패"));
        }, []);

        const runAI = async (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            setLoading(true);
            let rawNames = [];

            try {
                for (const file of files) {
                    const reader = new FileReader();
                    const base64 = await new Promise(r => {
                        reader.onload = () => r(reader.result.split(',')[1]);
                        reader.readAsDataURL(file);
                    });

                    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${CONFIG.API_KEY}`;
                    
                    const response = await fetch(API_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: "이 이미지에서 [GOM] 태그 뒤의 닉네임들을 추출해서 JSON 배열로 응답해줘. 예: {\"names\": [\"닉네임1\", \"닉네임2\"]}" },
                                    { inline_data: { mime_type: "image/jpeg", data: base64 } }
                                ]
                            }]
                        })
                    });

                    const resData = await response.json();
                    const text = resData.candidates?.[0]?.content?.parts?.[0]?.text || "";
                    const match = text.match(/\{.*\}/s);
                    if (match) {
                        const parsed = JSON.parse(match[0]);
                        if (parsed.names) rawNames = [...rawNames, ...parsed.names];
                    }
                }

                const newProcessed = rawNames.map(name => {
                    const clean = name.trim();
                    const found = masterList.find(m => clean.includes(m.name) || m.name.includes(clean));
                    return found ? { ...found } : { name: clean, role: "미등록" };
                });

                // ★ [핵심 수정] 기존 리스트(prev)에 새 리스트(newProcessed)를 합치고 중복 제거
                setScannedList(prev => {
                    const combined = [...prev, ...newProcessed];
                    // 닉네임 기준으로 중복 제거
                    const unique = combined.filter((item, index, self) =>
                        index === self.findIndex((t) => t.name === item.name)
                    );
                    return unique;
                });

                alert(`${files.length}장의 사진 분석 완료!`);

            } catch (err) {
                alert("분석 중 오류가 발생했습니다.");
            } finally {
                setLoading(false);
            }
        };
        
        // ... 뒷부분(UI 코드)은 동일하게 유지 ...
