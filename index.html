<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOS Fortress Tracker Pro</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .loading-spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const CONFIG = {
            // 1. 새로 배포하신 GAS 주소를 여기에 넣으세요
            GAS_URL: "https://script.google.com/macros/s/AKfycbxM8qa36ZkYfNjHBDAcB9yQQHh7CESM4T5-B_n6pmHqGqxHiMyUxoH_igCrWHuKDU5m/exec",
            // 2. 새로 발급하신 Gemini API Key를 여기에 넣으세요
            GEMINI_API_KEY: "AIzaSyCVgqua6AyL-IWFhO68gxRHb5JY8aJd8H4" 
        };

        function App() {
            const [masterList, setMasterList] = useState([]);
            const [scannedList, setScannedList] = useState([]);
            const [loading, setLoading] = useState(false);
            const [view, setView] = useState('main');

            const fetchMaster = () => {
                // GAS에서 마스터 명단 가져오기
                fetch(CONFIG.GAS_URL)
                    .then(res => res.json())
                    .then(data => {
                        setMasterList(Array.isArray(data) ? data : []);
                    })
                    .catch(err => console.error("데이터 로드 실패:", err));
            };

            useEffect(() => { fetchMaster(); }, []);

            const fileToBase64 = (file) => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });

            const handleFileUpload = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                setLoading(true);
                try {
                    let allExtractedNames = [];
                    for (const file of files) {
                        const base64Image = await fileToBase64(file);
                        
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${CONFIG.GEMINI_API_KEY}`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                contents: [{
                                    parts: [
                                        { text: "이미지에서 게임 캐릭터 닉네임만 추출해줘. [연맹] 태그는 빼고 이름만. JSON 형식으로 답해줘: {\"names\": [\"이름1\", \"이름2\"]}" },
                                        { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                                    ]
                                }]
                            })
                        });

                        const result = await response.json();
                        if (result.candidates && result.candidates[0].content.parts[0].text) {
                            const rawText = result.candidates[0].content.parts[0].text;
                            const jsonContent = rawText.match(/\{.*\}/s);
                            if (jsonContent) {
                                const parsed = JSON.parse(jsonContent[0]);
                                allExtractedNames = [...allExtractedNames, ...parsed.names];
                            }
                        }
                    }

                    const uniqueNames = [...new Set(allExtractedNames)];
                    const results = uniqueNames.map(name => {
                        const info = masterList.find(m => m.name.trim() === name.trim());
                        return info ? { ...info } : { name, role: "미등록", grade: "-" };
                    });

                    setScannedList(results);
                    
                    // 구글 시트에 자동 저장
                    fetch(CONFIG.GAS_URL, {
                        method: "POST",
                        mode: "no-cors",
                        body: JSON.stringify({ action: "saveLog", data: results })
                    });

                    alert(`스캔 완료! ${uniqueNames.length}명의 명단을 확인했습니다.`);
                } catch (error) {
                    alert("분석 중 오류가 발생했습니다. API 키나 인터넷 연결을 확인하세요.");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="max-w-md mx-auto p-4 min-h-screen">
                    <header className="flex justify-between items-center mb-6 py-4 border-b border-slate-700">
                        <h1 className="text-xl font-bold text-blue-400">WOS Tracker</h1>
                        <button onClick={() => setView(view === 'main' ? 'manage' : 'main')} className="bg-slate-800 px-3 py-1 rounded-lg text-sm">
                            {view === 'main' ? '명단 관리' : '홈으로'}
                        </button>
                    </header>

                    {loading && (
                        <div className="fixed inset-0 bg-black/80 flex flex-col items-center justify-center z-50">
                            <div className="loading-spinner mb-4"></div>
                            <p>AI가 분석 중입니다...</p>
                        </div>
                    )}

                    {view === 'main' ? (
                        <div className="space-y-4">
                            <div className="glass-card p-10 text-center rounded-3xl border-2 border-dashed border-slate-600">
                                <input type="file" multiple onChange={handleFileUpload} className="hidden" id="fileInput" accept="image/*" />
                                <label htmlFor="fileInput" className="cursor-pointer block">
                                    <div className="text-4xl mb-2">📸</div>
                                    <p className="font-bold">스크린샷 업로드</p>
                                </label>
                            </div>
                            
                            <div className="glass-card rounded-2xl overflow-hidden">
                                <div className="p-4 bg-slate-800/50 flex justify-between">
                                    <span className="font-bold">스캔 결과</span>
                                    <span className="text-blue-400 font-bold">{scannedList.length}명</span>
                                </div>
                                <div className="max-h-[400px] overflow-y-auto divide-y divide-slate-700">
                                    {scannedList.map((p, i) => (
                                        <div key={i} className="flex justify-between p-4 items-center">
                                            <span>{p.name}</span>
                                            <span className={`text-xs px-2 py-1 rounded ${p.role === '미등록' ? 'bg-red-900/50 text-red-400' : 'bg-green-900/50 text-green-400'}`}>
                                                {p.role}
                                            </span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="glass-card rounded-2xl overflow-hidden">
                            <div className="p-4 bg-slate-800/50 font-bold text-orange-400">마스터 명단 ({masterList.length}명)</div>
                            <div className="max-h-[500px] overflow-y-auto divide-y divide-slate-700">
                                {masterList.map((m, i) => (
                                    <div key={i} className="flex justify-between p-3 text-sm">
                                        <span className="font-bold">{m.name}</span>
                                        <span className="text-slate-500">{m.role}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
