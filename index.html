<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOS Fortress Tracker Pro</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .loading-spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const CONFIG = {
            GAS_URL: "https://script.google.com/macros/s/AKfycbxM8qa36ZkYfNjHBDAcB9yQQHh7CESM4T5-B_n6pmHqGqxHiMyUxoH_igCrWHuKDU5m/exec",
            GEMINI_API_KEY: "AIzaSyCVgqua6AyL-IWFhO68gxRHb5JY8aJd8H4" 
        };

        function App() {
            const [masterList, setMasterList] = useState([]);
            const [scannedList, setScannedList] = useState([]);
            const [loading, setLoading] = useState(false);
            const [loadingMsg, setLoadingMsg] = useState("");
            const [view, setView] = useState('main');

            const fetchMaster = () => {
                setLoadingMsg("마스터 명단을 불러오는 중...");
                fetch(CONFIG.GAS_URL)
                    .then(res => res.json())
                    .then(data => {
                        setMasterList(Array.isArray(data) ? data : []);
                        setLoadingMsg("");
                    })
                    .catch(err => {
                        console.error("데이터 로드 실패:", err);
                        setLoadingMsg("데이터를 불러오지 못했습니다.");
                    });
            };

            useEffect(() => { fetchMaster(); }, []);

            const fileToData = (file) => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve({
                    base64: reader.result.split(',')[1],
                    mime: file.type
                });
                reader.onerror = error => reject(error);
            });

            const handleFileUpload = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                setLoading(true);
                let allExtractedNames = [];
                
                try {
                    for (let i = 0; i < files.length; i++) {
                        setLoadingMsg(`${i + 1}번 스크린샷의 닉네임을 읽는 중...`);
                        const imageData = await fileToData(files[i]);
                        
                        // AI에게 더 명확하고 구체적인 명령(Prompt) 하달
                        const promptText = `이 이미지는 '화이트아웃 서바이벌(Whiteout Survival)' 게임의 연맹원 명단 스크린샷이야. 
                        이미지에서 [연맹 태그]를 제외한 순수 '닉네임'들만 모두 추출해줘. 
                        다른 설명은 일절 하지 말고 오직 JSON 데이터만 보내줘. 
                        형식: {"names": ["닉네임1", "닉네임2"]}`;

                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${CONFIG.GEMINI_API_KEY}`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                contents: [{
                                    parts: [
                                        { text: promptText },
                                        { inline_data: { mime_type: imageData.mime, data: imageData.base64 } }
                                    ]
                                }]
                            })
                        });

                        const result = await response.json();
                        
                        if (result.candidates && result.candidates[0].content.parts[0].text) {
                            const rawText = result.candidates[0].content.parts[0].text;
                            const jsonMatch = rawText.match(/\{[\s\S]*\}/);
                            if (jsonMatch) {
                                const parsed = JSON.parse(jsonMatch[0]);
                                if (parsed.names && Array.isArray(parsed.names)) {
                                    allExtractedNames = [...allExtractedNames, ...parsed.names];
                                }
                            }
                        }
                    }

                    if (allExtractedNames.length === 0) {
                        alert("이미지에서 닉네임을 찾지 못했습니다. 글자가 선명한지 확인해주세요!");
                        setLoading(false);
                        return;
                    }

                    const uniqueNames = [...new Set(allExtractedNames.map(n => n.trim()))];
                    const results = uniqueNames.map(name => {
                        const info = masterList.find(m => m.name.trim() === name);
                        return info ? { ...info } : { name, role: "미등록", grade: "-" };
                    });

                    setScannedList(results);
                    
                    setLoadingMsg("구글 시트에 기록하는 중...");
                    await fetch(CONFIG.GAS_URL, {
                        method: "POST",
                        mode: "no-cors",
                        body: JSON.stringify({ action: "saveLog", data: results })
                    });

                    alert(`성공! 총 ${uniqueNames.length}명의 닉네임을 찾았습니다.`);
                } catch (error) {
                    console.error("Error:", error);
                    alert("분석 도중 오류가 발생했습니다.");
                } finally {
                    setLoading(false);
                    setLoadingMsg("");
                }
            };

            return (
                <div className="max-w-md mx-auto p-4 min-h-screen">
                    <header className="flex justify-between items-center mb-6 py-4 border-b border-slate-700">
                        <h1 className="text-xl font-bold text-blue-400">WOS Tracker</h1>
                        <button onClick={() => setView(view === 'main' ? 'manage' : 'main')} className="bg-slate-800 px-3 py-1 rounded-lg text-sm">
                            {view === 'main' ? '명단 관리' : '홈으로'}
                        </button>
                    </header>

                    {loading && (
                        <div className="fixed inset-0 bg-black/80 flex flex-col items-center justify-center z-50 p-10 text-center">
                            <div className="loading-spinner mb-4"></div>
                            <p className="text-white font-bold">{loadingMsg}</p>
                        </div>
                    )}

                    {view === 'main' ? (
                        <div className="space-y-4">
                            <div className="glass-card p-10 text-center rounded-3xl border-2 border-dashed border-slate-600 relative overflow-hidden">
                                <input type="file" multiple onChange={handleFileUpload} className="absolute inset-0 opacity-0 cursor-pointer" accept="image/*" />
                                <div className="text-4xl mb-2">📸</div>
                                <p className="font-bold">스크린샷 업로드</p>
                                <p className="text-xs text-slate-400 mt-1">이곳을 클릭하여 사진을 선택하세요</p>
                            </div>
                            
                            <div className="glass-card rounded-2xl overflow-hidden">
                                <div className="p-4 bg-slate-800/50 flex justify-between items-center">
                                    <span className="font-bold text-sm">스캔된 명단</span>
                                    <span className="text-blue-400 font-bold">{scannedList.length}명</span>
                                </div>
                                <div className="max-h-[400px] overflow-y-auto divide-y divide-slate-700">
                                    {scannedList.length === 0 ? (
                                        <div className="p-10 text-center text-slate-500 text-sm">표시할 내용이 없습니다.</div>
                                    ) : (
                                        scannedList.map((p, i) => (
                                            <div key={i} className="flex justify-between p-4 items-center animate-fadeIn">
                                                <span className="font-medium">{p.name}</span>
                                                <span className={`text-[10px] px-2 py-1 rounded-full font-bold ${p.role === '미등록' ? 'bg-red-900/40 text-red-400' : 'bg-green-900/40 text-green-400'}`}>
                                                    {p.role}
                                                </span>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>

                            {scannedList.length > 0 && (
                                <button 
                                    onClick={() => {
                                        const text = scannedList.map(p => p.name).join(', ');
                                        navigator.clipboard.writeText(text);
                                        alert("닉네임 목록이 복사되었습니다.");
                                    }}
                                    className="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-bold transition"
                                >
                                    명단 전체 복사하기
                                </button>
                            )}
                        </div>
                    ) : (
                        <div className="glass-card rounded-2xl overflow-hidden">
                            <div className="p-4 bg-slate-800/50 font-bold text-orange-400">마스터 명단 ({masterList.length}명)</div>
                            <div className="max-h-[500px] overflow-y-auto divide-y divide-slate-700">
                                {masterList.map((m, i) => (
                                    <div key={i} className="flex justify-between p-3 text-sm">
                                        <span className="font-bold">{m.name}</span>
                                        <span className="text-slate-500">{m.role}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
