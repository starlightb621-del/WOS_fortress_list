<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOS Tracker Pro - V2.3</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background: #0f172a; color: #f1f5f9; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const CONFIG = {
            GAS_URL: "https://script.google.com/macros/s/AKfycbxM8qa36ZkYfNjHBDAcB9yQQHh7CESM4T5-B_n6pmHqGqxHiMyUxoH_igCrWHuKDU5m/exec",
            // ★ 주의: 계속 안 되면 구글 AI 스튜디오에서 이 키를 새로 발급받아 교체해야 할 수 있습니다.
            API_KEY: "AIzaSyCVgqua6AyL-IWFhO68gxRHb5JY8aJd8H4"
        };

        function App() {
            const [masterList, setMasterList] = useState([]);
            const [scannedList, setScannedList] = useState([]);
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                fetch(CONFIG.GAS_URL).then(r => r.json()).then(d => setMasterList(d)).catch(e => console.error("명단 로드 실패"));
            }, []);

            const runAI = async (e) => {
                const files = Array.from(e.target.files);
                if (!files.length) return;

                setLoading(true);
                let rawNames = [];

                try {
                    for (const file of files) {
                        const reader = new FileReader();
                        const base64 = await new Promise(r => {
                            reader.onload = () => r(reader.result.split(',')[1]);
                            reader.readAsDataURL(file);
                        });

                        // [핵심 변경] 모델 이름에 -latest 를 붙였습니다.
                        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${CONFIG.API_KEY}`;
                        console.log("🔥 [V2.3] 연결 시도 주소:", API_URL);

                        const response = await fetch(API_URL, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                contents: [{
                                    parts: [
                                        { text: "이 사진에서 [GOM] 태그가 붙은 유저들의 닉네임만 뽑아서 JSON으로 줘. 예: {\"names\":[\"닉네임1\"]}" },
                                        { inline_data: { mime_type: "image/jpeg", data: base64 } }
                                    ]
                                }]
                            })
                        });

                        // [핵심 변경] 에러 발생 시 구글 서버의 상세 응답을 콘솔에 텍스트로 찍어냅니다.
                        if (!response.ok) {
                            const errorText = await response.text();
                            console.error("🚨 구글 서버 상세 에러 메시지:", errorText);
                            throw new Error(`상태코드 ${response.status}: 콘솔(F12)을 확인해주세요.`);
                        }
                        
                        const resData = await response.json();
                        const text = resData.candidates?.[0]?.content?.parts?.[0]?.text || "";
                        const match = text.match(/\{.*\}/s);
                        if (match) {
                            const parsed = JSON.parse(match[0]);
                            if (parsed.names) rawNames = [...rawNames, ...parsed.names];
                        }
                    }

                    const processed = [...new Set(rawNames)].map(name => {
                        const clean = name.trim();
                        const found = masterList.find(m => clean.includes(m.name) || m.name.includes(clean));
                        return found ? { ...found } : { name: clean, role: "미등록" };
                    });

                    setScannedList(processed);
                    alert(`${processed.length}명을 성공적으로 읽었습니다!`);

                } catch (err) {
                    console.error("에러 상세:", err);
                    alert(`분석 오류 발생!\n${err.message}`);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen p-4 flex flex-col">
                    <header className="py-6 text-center">
                        <h1 className="text-2xl font-bold text-blue-400 tracking-tight">WOS TRACKER PRO</h1>
                        <p className="text-[10px] text-orange-400 font-bold uppercase tracking-widest">Version 2.3 - Deep Debug</p>
                    </header>

                    <main className="flex-1 space-y-4">
                        <div className="glass p-10 rounded-3xl text-center relative border-2 border-dashed border-slate-700 hover:border-blue-500 transition-all group">
                            <input type="file" multiple onChange={runAI} className="absolute inset-0 opacity-0 cursor-pointer z-10" />
                            <div className="text-4xl mb-2 group-hover:scale-110 transition-transform">📸</div>
                            <p className="text-sm font-bold text-slate-300">집결 스크린샷 업로드</p>
                        </div>

                        {loading && (
                            <div className="text-center py-4 animate-pulse">
                                <p className="text-blue-400 text-xs font-bold">AI가 명단을 분석하는 중...</p>
                            </div>
                        )}

                        <div className="glass rounded-2xl overflow-hidden shadow-2xl">
                            <div className="p-4 bg-slate-800/50 flex justify-between border-b border-white/5">
                                <span className="text-xs font-bold text-slate-400 uppercase">분석 결과 ({scannedList.length})</span>
                                <button onClick={() => setScannedList([])} className="text-[10px] text-red-500 font-bold">초기화</button>
                            </div>
                            <div className="max-h-[400px] overflow-y-auto">
                                {scannedList.length === 0 ? (
                                    <p className="p-16 text-center text-slate-600 text-xs italic font-light">데이터가 없습니다.</p>
                                ) : (
                                    scannedList.map((p, i) => (
                                        <div key={i} className="flex justify-between p-4 border-b border-white/5 items-center">
                                            <span className="text-sm">{p.name}</span>
                                            <span className={`text-[9px] px-2 py-0.5 rounded border ${p.role === '미등록' ? 'text-red-400 border-red-400/30' : 'text-blue-400 border-blue-400/30'}`}>
                                                {p.role}
                                            </span>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    </main>

                    <footer className="py-4 text-center text-[9px] text-slate-600 uppercase tracking-widest">
                        Check Console (F12) for Debug Logs
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
