<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOS Tracker Pro - V3.2 Stable</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background: #0f172a; color: #f1f5f9; margin: 0; padding: 0; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        const CONFIG = {
            // 구글 시트 연동 URL
            GAS_URL: "https://script.google.com/macros/s/AKfycbxM8qa36ZkYfNjHBDAcB9yQQHh7CESM4T5-B_n6pmHqGqxHiMyUxoH_igCrWHuKDU5m/exec",
            // ★ 여기에 새로 발급받은 Gemini API 키를 입력하세요!
            API_KEY: "여기에_새로_발급받은_키_넣기",
            MODEL: "gemini-1.5-flash-latest"
        };

        function App() {
            const [masterList, setMasterList] = useState([]);
            const [scannedList, setScannedList] = useState([]);
            const [loading, setLoading] = useState(false);
            const [statusMsg, setStatusMsg] = useState("");

            // 1. 마스터 리스트(구글 시트) 불러오기
            useEffect(() => {
                fetch(CONFIG.GAS_URL)
                    .then(r => r.json())
                    .then(d => {
                        setMasterList(d);
                        console.log("마스터 명단 로드 완료");
                    })
                    .catch(e => console.error("명단 로드 실패:", e));
            }, []);

            // 2. 이미지 분석 함수 (핵심 로직)
            const runAI = async (e) => {
                const files = Array.from(e.target.files);
                if (!files.length) return;

                setLoading(true);
                setStatusMsg("이미지 분석 중...");
                
                let allExtractedNames = [];

                try {
                    for (let i = 0; i < files.length; i++) {
                        setStatusMsg(`${i + 1}번째 이미지 읽는 중...`);
                        const file = files[i];
                        
                        // 이미지를 AI가 읽을 수 있는 텍스트(Base64)로 변환
                        const reader = new FileReader();
                        const base64Promise = new Promise(resolve => {
                            reader.onload = () => resolve(reader.result.split(',')[1]);
                            reader.readAsDataURL(file);
                        });
                        const base64Data = await base64Promise;

                        // Gemini API 호출 (v1beta 엔드포인트 사용)
                        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${CONFIG.MODEL}:generateContent?key=${CONFIG.API_KEY}`;
                        
                        const response = await fetch(API_URL, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                contents: [{
                                    parts: [
                                        { text: "이 이미지에서 [GOM] 태그 뒤의 닉네임들을 모두 찾아줘. 결과는 반드시 JSON 형식으로 보내줘. 예: {\"names\": [\"닉네임1\", \"닉네임2\"]}" },
                                        { inline_data: { mime_type: "image/jpeg", data: base64Data } }
                                    ]
                                }]
                            })
                        });

                        const resData = await response.json();
                        
                        // API 에러 체크
                        if (resData.error) {
                            throw new Error(resData.error.message);
                        }

                        const aiText = resData.candidates?.[0]?.content?.parts?.[0]?.text || "";
                        const jsonMatch = aiText.match(/\{.*\}/s);
                        
                        if (jsonMatch) {
                            const parsed = JSON.parse(jsonMatch[0]);
                            if (parsed.names) {
                                allExtractedNames = [...allExtractedNames, ...parsed.names];
                            }
                        }
                    }

                    // 3. 마스터 리스트와 대조 및 중복 제거
                    const processedData = allExtractedNames.map(name => {
                        const cleanName = name.trim();
                        // 부분 일치 검사 (예: "닉네임"이 마스터 리스트의 "닉네임(본)"에 포함되는지 확인)
                        const match = masterList.find(m => cleanName.includes(m.name) || m.name.includes(cleanName));
                        return match ? { ...match } : { name: cleanName, role: "미등록" };
                    });

                    // 기존 리스트에 누적 + 이름 기준 중복 제거
                    setScannedList(prev => {
                        const combined = [...prev, ...processedData];
                        return combined.filter((item, index, self) =>
                            index === self.findIndex((t) => t.name === item.name)
                        );
                    });

                    setStatusMsg("분석 완료!");
                } catch (err) {
                    console.error("오류 발생:", err);
                    alert("분석 중 오류가 발생했습니다. API 키나 네트워크를 확인해주세요.");
                    setStatusMsg("오류 발생");
                } finally {
                    setLoading(false);
                    // 3초 후 상태 메시지 초기화
                    setTimeout(() => setStatusMsg(""), 3000);
                }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen p-4 flex flex-col">
                    <header className="py-8 text-center">
                        <h1 className="text-3xl font-bold text-blue-400 tracking-tighter" style={{fontFamily: 'Orbitron'}}>WOS TRACKER PRO</h1>
                        <p className="text-[10px] text-green-400 font-bold uppercase tracking-[0.2em] mt-1">Version 3.2 - Stable Cumulative</p>
                    </header>

                    <main className="flex-1 space-y-6">
                        {/* 업로드 영역 */}
                        <div className="glass p-10 rounded-[2rem] text-center relative border-2 border-dashed border-slate-700 hover:border-blue-500 transition-all group">
                            <input type="file" multiple onChange={runAI} className="absolute inset-0 opacity-0 cursor-pointer z-10" />
                            <div className="text-5xl mb-3 group-hover:scale-110 transition-transform">📸</div>
                            <p className="text-sm font-bold text-slate-300">스크린샷 추가 업로드</p>
                            <p className="text-[10px] text-slate-500 mt-1">여러 장을 선택해도 모두 누적됩니다</p>
                        </div>

                        {/* 상태 표시 */}
                        {loading && (
                            <div className="flex items-center justify-center space-x-2 text-blue-400">
                                <div className="w-2 h-2 bg-blue-400 rounded-full animate-bounce"></div>
                                <span className="text-xs font-bold tracking-widest">{statusMsg}</span>
                            </div>
                        )}

                        {/* 결과 리스트 */}
                        <div className="glass rounded-[1.5rem] overflow-hidden flex flex-col">
                            <div className="p-4 bg-slate-800/80 flex justify-between items-center border-b border-white/5">
                                <span className="text-xs font-bold text-slate-400 uppercase tracking-wider">스캔 결과 ({scannedList.length}명)</span>
                                <button 
                                    onClick={() => { if(confirm("전체 삭제하시겠습니까?")) setScannedList([]) }} 
                                    className="text-[10px] bg-red-500/10 text-red-500 px-2 py-1 rounded-md font-bold hover:bg-red-500 hover:text-white transition-all"
                                >
                                    전체 삭제
                                </button>
                            </div>
                            
                            <div className="max-h-[450px] overflow-y-auto custom-scroll">
                                {scannedList.length === 0 ? (
                                    <div className="py-20 text-center">
                                        <p className="text-slate-600 text-xs italic">대기 중... 사진을 올려주세요.</p>
                                    </div>
                                ) : (
                                    scannedList.map((p, i) => (
                                        <div key={i} className="flex justify-between p-4 border-b border-white/5 items-center hover:bg-white/5 transition-colors">
                                            <div className="flex flex-col">
                                                <span className="text-sm font-medium">{p.name}</span>
                                            </div>
                                            <span className={`text-[9px] font-bold px-2 py-1 rounded-full border ${
                                                p.role === '미등록' 
                                                ? 'border-red-500/50 text-red-400 bg-red-500/5' 
                                                : 'border-blue-500/50 text-blue-400 bg-blue-500/5'
                                            }`}>
                                                {p.role}
                                            </span>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    </main>

                    <footer className="py-6 text-center text-[10px] text-slate-600 uppercase tracking-widest">
                        Developed for WOS Fortress Management
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
