<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOS Fortress Tracker</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #1a202c; color: white; }
        .loading-spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const CONFIG = {
            GAS_URL: "https://script.google.com/macros/s/AKfycbzwxitJHULZRrKJjCtMJNHZIVW69V1dWRvZfzQ-EJ5TUOlCxl5PLo9py_pF__KxQlRH/exec",
            GEMINI_API_KEY: "AQ.Ab8RN6IzSKGEzd8SX74VJ4dch28_QBlbWRmFSgJRCAnFIwjBQw"
        };

        function App() {
            const [masterList, setMasterList] = useState([]);
            const [scannedList, setScannedList] = useState([]);
            const [loading, setLoading] = useState(false);
            const [view, setView] = useState('main'); // 'main' or 'manage'

            // 1. 마스터 리스트 실시간 불러오기
            const fetchMaster = () => {
                fetch(CONFIG.GAS_URL)
                    .then(res => res.json())
                    .then(data => setMasterList(data))
                    .catch(err => console.error("시트 로드 실패:", err));
            };

            useEffect(() => { fetchMaster(); }, []);

            // 2. 이미지 -> Base64 변환
            const fileToBuffer = (file) => new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result.split(',')[1]);
                reader.readAsDataURL(file);
            });

            // 3. Gemini AI 분석 실행
            const handleFileUpload = async (e) => {
    const files = Array.from(e.target.files);
    if (files.length === 0) return;

    setLoading(true); // 1. 로딩 표시 시작 (이제 화면에 분석 중 글자가 떠야 합니다)
    
    try {
        let allExtractedNames = [];
        
        for (const file of files) {
            const base64Image = await fileToBuffer(file);
            
            // 2. Gemini API 호출
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${CONFIG.GEMINI_API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: "추출 규칙: [GOM] 태그를 제외한 닉네임만 찾아줘. JSON 형식 {"names": ["닉네임1", "닉네임2"]}로 응답해." },
                            { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                        ]
                    }]
                })
            });

            const result = await response.json();
            if (result.candidates && result.candidates[0]) {
                const textResponse = result.candidates[0].content.parts[0].text;
                const jsonMatch = textResponse.match(/\{.*\}/s);
                if (jsonMatch) {
                    const names = JSON.parse(jsonMatch[0]).names;
                    allExtractedNames = [...allExtractedNames, ...names];
                }
            }
        }

        // 3. 중복 제거 및 마스터 리스트 대조
        const uniqueNames = [...new Set(allExtractedNames)];
        const matchedParticipants = uniqueNames.map(name => {
            const info = masterList.find(m => m.name === name);
            return info ? { name, role: info.role, grade: info.grade } : { name, role: "미등록", grade: "-" };
        });

        setScannedList(matchedParticipants);

        // 4. GAS 저장 (가장 문제가 되는 부분 - no-cors 모드 적용)
        await fetch(CONFIG.GAS_URL, {
            method: "POST",
            mode: "no-cors", // 브라우저 차단을 방지하는 핵심 옵션
            headers: { "Content-Type": "text/plain" }, // 브라우저 검사를 피하기 위해 text/plain 사용
            body: JSON.stringify({ action: "saveLog", data: matchedParticipants })
        });
        
        alert(`분석 완료! ${matchedParticipants.length}명의 명단을 확인했습니다.`);
    } catch (error) {
        console.error("에러 발생:", error);
        alert("분석 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.");
    } finally {
        setLoading(false); // 5. 로딩 종료
    }
};
            // 클립보드 복사
            const copyToClipboard = () => {
                const text = scannedList.map((p, i) => `${i+1}. ${p.name} (${p.role})`).join('\n');
                navigator.clipboard.writeText(text);
                alert("복사되었습니다!");
            };

            return (
                <div className="max-w-md mx-auto p-4 min-h-screen">
                    <header className="flex justify-between items-center mb-6 py-2 border-b border-gray-700">
                        <h1 className="text-xl font-bold text-blue-400">WOS Tracker</h1>
                        <button onClick={() => setView(view === 'main' ? 'manage' : 'main')} className="text-sm bg-gray-700 px-3 py-1 rounded hover:bg-gray-600">
                            {view === 'main' ? '명단 관리' : '홈으로'}
                        </button>
                    </header>

                    {loading && (
                        <div className="fixed inset-0 bg-black/50 flex flex-col items-center justify-center z-50">
                            <div className="loading-spinner mb-4"></div>
                            <p>AI 분석 중... 잠시만 기다려주세요.</p>
                        </div>
                    )}

                    {view === 'main' ? (
                        <div className="space-y-4">
                            <div className="border-2 border-dashed border-gray-600 p-10 text-center rounded-xl bg-gray-800/50 hover:border-blue-500 transition-all">
                                <input type="file" multiple onChange={handleFileUpload} className="hidden" id="fileInput" accept="image/*" />
                                <label htmlFor="fileInput" className="cursor-pointer block">
                                    <div className="text-4xl mb-2">📸</div>
                                    <p className="font-bold text-gray-300">스크린샷 업로드</p>
                                    <p className="text-xs text-gray-500 mt-1">여러 장 동시 선택 가능</p>
                                </label>
                            </div>
                            
                            <div className="bg-gray-800 p-4 rounded-xl shadow-xl border border-gray-700">
                                <h2 className="mb-3 font-bold flex justify-between">
                                    <span>참여 명단</span>
                                    <span className="text-blue-400">{scannedList.length}명</span>
                                </h2>
                                <div className="space-y-2 text-sm max-h-[400px] overflow-y-auto pr-2">
                                    {scannedList.length > 0 ? scannedList.map((p, i) => (
                                        <div key={i} className="flex justify-between p-2 bg-gray-700/50 rounded">
                                            <span>{i+1}. <strong className={p.role === '미등록' ? 'text-red-400' : 'text-white'}>{p.name}</strong></span>
                                            <span className="text-xs px-2 py-0.5 bg-gray-600 rounded text-gray-300">{p.role}</span>
                                        </div>
                                    )) : <p className="text-center text-gray-500 py-10">스캔된 데이터가 없습니다.</p>}
                                </div>
                            </div>

                            <div className="flex gap-2">
                                <button onClick={copyToClipboard} className="flex-2 bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-bold transition-all flex-grow">명단 복사</button>
                                <button onClick={() => setScannedList([])} className="flex-1 bg-gray-700 hover:bg-gray-600 py-4 rounded-xl font-bold transition-all">초기화</button>
                            </div>
                        </div>
                    ) : (
                        <div className="space-y-4">
                            <div className="bg-gray-800 p-4 rounded-xl border border-gray-700">
                                <h2 className="mb-4 font-bold text-orange-400">마스터 리스트 ({masterList.length}명)</h2>
                                <div className="space-y-2 max-h-[500px] overflow-y-auto">
                                    {masterList.map((m, i) => (
                                        <div key={i} className="flex gap-2 items-center text-sm border-b border-gray-700 pb-2">
                                            <span className="flex-1 font-bold">{m.name}</span>
                                            <span className="text-gray-400 text-xs">{m.grade}</span>
                                            <span className="bg-blue-900/50 text-blue-300 px-2 py-0.5 rounded text-xs">{m.role}</span>
                                        </div>
                                    ))}
                                </div>
                                <p className="mt-4 text-[10px] text-gray-500 text-center">※ 데이터 수정은 구글 시트에서 직접 하시면 실시간으로 반영됩니다.</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
