<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOS Tracker Pro - Ultra Fix</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .loading-spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const CONFIG = {
            GAS_URL: "https://script.google.com/macros/s/AKfycbxM8qa36ZkYfNjHBDAcB9yQQHh7CESM4T5-B_n6pmHqGqxHiMyUxoH_igCrWHuKDU5m/exec",
            GEMINI_API_KEY: "AIzaSyCVgqua6AyL-IWFhO68gxRHb5JY8aJd8H4" 
        };

        function App() {
            const [masterList, setMasterList] = useState([]);
            const [scannedList, setScannedList] = useState([]);
            const [loading, setLoading] = useState(false);
            const [loadingMsg, setLoadingMsg] = useState("");
            const [view, setView] = useState('main');

            useEffect(() => {
                fetch(CONFIG.GAS_URL)
                    .then(res => res.json())
                    .then(data => setMasterList(Array.isArray(data) ? data : []))
                    .catch(e => console.error("명단 로드 실패"));
            }, []);

            const handleFileUpload = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                setLoading(true);
                let allExtractedNames = [];
                
                try {
                    for (let i = 0; i < files.length; i++) {
                        setLoadingMsg(`${i + 1}번 사진 분석 중...`);
                        const reader = new FileReader();
                        const base64 = await new Promise(r => {
                            reader.onload = () => r(reader.result.split(',')[1]);
                            reader.readAsDataURL(files[i]);
                        });

                        // [중요] 404 해결을 위해 v1beta로 주소를 다시 변경했습니다.
                        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${CONFIG.GEMINI_API_KEY}`;

                        const response = await fetch(apiUrl, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                contents: [{
                                    parts: [
                                        { text: "이 이미지는 '화이트아웃 서바이벌' 게임의 부대 목록이야. '[GOM]' 태그 바로 오른쪽에 있는 유저 닉네임들만 모두 추출해줘. 복잡한 특수문자나 이모티콘은 제외하고 글자 위주로만 뽑아줘. 반드시 JSON 형식으로만 답해: {\"names\": [\"닉네임1\", \"닉네임2\"]}" },
                                        { inline_data: { mime_type: "image/jpeg", data: base64 } }
                                    ]
                                }]
                            })
                        });

                        if (!response.ok) throw new Error(`서버 응답 오류: ${response.status}`);

                        const result = await response.json();
                        const text = result.candidates?.[0]?.content?.parts?.[0]?.text || "";
                        const jsonMatch = text.match(/\{[\s\S]*\}/);
                        
                        if (jsonMatch) {
                            const parsed = JSON.parse(jsonMatch[0]);
                            if (parsed.names) allExtractedNames = [...allExtractedNames, ...parsed.names];
                        }
                    }

                    // 매칭 로직 보강: 특수문자가 섞인 이름도 찾을 수 있게 합니다.
                    const finalResults = allExtractedNames.map(name => {
                        const clean = name.trim();
                        // 마스터 명단의 이름이 스캔된 이름에 포함되어 있는지 확인
                        const match = masterList.find(m => clean.includes(m.name.trim()) || m.name.trim().includes(clean));
                        return match ? { ...match } : { name: clean, role: "미등록" };
                    });

                    setScannedList(finalResults);
                    
                    // GAS에 로그 저장
                    fetch(CONFIG.GAS_URL, {
                        method: "POST",
                        mode: "no-cors",
                        body: JSON.stringify({ action: "saveLog", data: finalResults })
                    });

                    alert(`${finalResults.length}명의 데이터를 읽었습니다!`);
                } catch (error) {
                    console.error("Error details:", error);
                    alert(`오류 발생: ${error.message}\n인터넷 연결이나 API 주소를 다시 확인해주세요.`);
                } finally {
                    setLoading(false);
                    setLoadingMsg("");
                }
            };

            return (
                <div className="max-w-md mx-auto p-4 min-h-screen">
                    <header className="flex justify-between items-center mb-6 py-4 border-b border-slate-700">
                        <h1 className="text-xl font-bold text-blue-400 italic">WOS TRACKER PRO</h1>
                        <button onClick={() => setView(view === 'main' ? 'manage' : 'main')} className="bg-slate-800 px-3 py-1 rounded-lg text-xs font-bold uppercase">
                            {view === 'main' ? 'Master List' : 'Home'}
                        </button>
                    </header>

                    {loading && (
                        <div className="fixed inset-0 bg-black/90 flex flex-col items-center justify-center z-50">
                            <div className="loading-spinner mb-4 border-t-blue-500"></div>
                            <p className="text-blue-400 font-bold tracking-widest">{loadingMsg}</p>
                        </div>
                    )}

                    {view === 'main' ? (
                        <div className="space-y-4">
                            <div className="glass-card p-12 text-center rounded-3xl border-2 border-dashed border-slate-600 relative hover:border-blue-500 transition-colors group">
                                <input type="file" multiple onChange={handleFileUpload} className="absolute inset-0 opacity-0 cursor-pointer" accept="image/*" />
                                <div className="text-5xl mb-4 group-hover:scale-110 transition-transform">📸</div>
                                <p className="font-bold text-slate-300">스크린샷 업로드</p>
                                <p className="text-[10px] text-slate-500 mt-2 uppercase tracking-tighter">Click or Drag images here</p>
                            </div>
                            
                            <div className="glass-card rounded-2xl overflow-hidden shadow-2xl">
                                <div className="p-4 bg-slate-800/80 flex justify-between items-center border-b border-white/5">
                                    <span className="font-bold text-sm tracking-tight text-slate-300">스캔 결과 <span className="text-blue-400 ml-1">{scannedList.length}</span></span>
                                    <button onClick={() => setScannedList([])} className="text-[10px] text-red-500 font-bold uppercase hover:text-red-400">Clear</button>
                                </div>
                                <div className="max-h-[400px] overflow-y-auto divide-y divide-white/5">
                                    {scannedList.length === 0 ? (
                                        <div className="p-16 text-center text-slate-600 text-xs italic">No data detected.</div>
                                    ) : (
                                        scannedList.map((p, i) => (
                                            <div key={i} className="flex justify-between p-4 items-center bg-slate-800/20">
                                                <span className="text-sm font-semibold text-slate-200">{p.name}</span>
                                                <span className={`text-[9px] px-2 py-1 rounded-md font-black ${p.role === '미등록' ? 'bg-red-500/10 text-red-500 border border-red-500/20' : 'bg-blue-500/10 text-blue-400 border border-blue-500/20'}`}>
                                                    {p.role}
                                                </span>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="glass-card rounded-2xl overflow-hidden border border-orange-500/20">
                            <div className="p-4 bg-orange-500/10 font-bold text-orange-400 text-sm border-b border-orange-500/20">연맹 마스터 명단 ({masterList.length}명)</div>
                            <div className="max-h-[500px] overflow-y-auto divide-y divide-white/5">
                                {masterList.map((m, i) => (
                                    <div key={i} className="flex justify-between p-3 text-xs hover:bg-white/5 transition-colors">
                                        <span className="font-bold text-slate-300">{m.name}</span>
                                        <span className="text-slate-500">{m.role}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
