<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOS 요새쟁탈 명단 PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { 
            font-family: 'Pretendard', sans-serif; 
            background: linear-gradient(180deg, #EBF4FF 0%, #FFFFFF 100%);
        }
        .card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }
        .tab-active {
            background: linear-gradient(90deg, #3B82F6 0%, #2563EB 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }
        .btn-gradient {
            background: linear-gradient(90deg, #3B82F6 0%, #0EA5E9 100%);
            transition: all 0.3s ease;
        }
        .btn-gradient:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        /* Custom scrollbar for the list */
        .member-list::-webkit-scrollbar {
            width: 6px;
        }
        .member-list::-webkit-scrollbar-thumb {
            background: #E2E8F0;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-8">

    <!-- Header Status -->
    <div class="flex items-center space-x-2 bg-blue-50 px-4 py-1.5 rounded-full mb-6 border border-blue-100 shadow-sm">
        <div class="w-2 h-2 bg-blue-500 rounded-full animate-pulse"></div>
        <span class="text-blue-600 text-xs font-bold uppercase tracking-wider">Cloud Connected</span>
    </div>

    <!-- Title -->
    <h1 class="text-4xl font-black text-gray-900 mb-8 tracking-tight">
        WOS 요새쟁탈 <span class="text-blue-600">명단 PRO</span>
    </h1>

    <div class="w-full max-w-lg space-y-6">
        
        <!-- Time Tabs -->
        <div class="card p-2 flex space-x-1">
            <button onclick="setTab('12시')" id="tab-12시" class="flex-1 py-3 rounded-2xl text-sm font-bold transition-all tab-active">12시</button>
            <button onclick="setTab('18시')" id="tab-18시" class="flex-1 py-3 rounded-2xl text-sm font-bold text-gray-400 hover:bg-gray-100 transition-all">18시</button>
            <button onclick="setTab('21시')" id="tab-21시" class="flex-1 py-3 rounded-2xl text-sm font-bold text-gray-400 hover:bg-gray-100 transition-all">21시</button>
        </div>

        <!-- Input Section -->
        <div class="card p-6 space-y-4">
            <div class="flex space-x-2">
                <input type="text" id="manualInput" 
                    class="flex-1 bg-gray-50 border-none rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-400 outline-none"
                    placeholder="닉네임 직접 입력...">
                <button onclick="addManualMember()" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold text-sm hover:bg-blue-700 transition">추가</button>
            </div>
            
            <label for="ocrUpload" class="cursor-pointer block">
                <div class="w-full border-2 border-dashed border-blue-200 rounded-2xl p-4 flex items-center justify-center space-x-2 text-blue-500 bg-blue-50 hover:bg-blue-100 transition">
                    <i class="fa-solid fa-camera"></i>
                    <span class="text-sm font-bold">스크린샷 스캔 (자동보정)</span>
                </div>
                <input type="file" id="ocrUpload" class="hidden" accept="image/*" onchange="handleOCR(event)">
            </label>
        </div>

        <!-- List Section -->
        <div class="card flex flex-col overflow-hidden min-h-[400px]">
            <div class="p-6 border-b border-gray-50 flex justify-between items-center">
                <h2 class="font-bold text-gray-700 text-sm">참여 명단 (<span id="memberCount">0</span>명)</h2>
                <button onclick="clearList()" class="text-gray-400 hover:text-red-500 transition">
                    <i class="fa-solid fa-rotate-right text-xs"></i>
                </button>
            </div>

            <div id="memberList" class="flex-1 overflow-y-auto max-h-[350px] p-6 member-list">
                <!-- Empty State -->
                <div id="emptyState" class="h-full flex flex-col items-center justify-center py-10 opacity-40">
                    <div class="w-16 h-16 bg-gray-100 rounded-2xl flex items-center justify-center mb-4">
                        <i class="fa-solid fa-shield-check text-2xl text-gray-400"></i>
                    </div>
                    <p class="text-sm font-medium text-gray-500">데이터가 없습니다</p>
                </div>
                
                <!-- Member Items go here -->
            </div>

            <div class="p-6 pt-0">
                <button onclick="copyToClipboard()" class="w-full btn-gradient text-white py-4 rounded-2xl font-bold flex items-center justify-center space-x-2 shadow-lg">
                    <i class="fa-regular fa-copy"></i>
                    <span>명단 복사하기</span>
                </button>
                
                <div class="mt-4 flex justify-center">
                    <button onclick="openMasterList()" class="text-xs text-gray-400 font-medium hover:text-blue-500 flex items-center space-x-1">
                        <i class="fa-solid fa-gear"></i>
                        <span>마스터 명단 확인</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-10 bg-gray-900 text-white px-6 py-3 rounded-full text-sm font-bold opacity-0 transition-all pointer-events-none">
        복사되었습니다!
    </div>

    <script>
        let currentTab = '12시';
        let membersByTime = {
            '12시': [],
            '18시': [],
            '21시': []
        };

        function setTab(time) {
            currentTab = time;
            document.querySelectorAll('[id^="tab-"]').forEach(btn => {
                btn.classList.remove('tab-active');
                btn.classList.add('text-gray-400', 'hover:bg-gray-100');
            });
            const activeBtn = document.getElementById(`tab-${time}`);
            activeBtn.classList.add('tab-active');
            activeBtn.classList.remove('text-gray-400', 'hover:bg-gray-100');
            renderList();
        }

        function renderList() {
            const listEl = document.getElementById('memberList');
            const countEl = document.getElementById('memberCount');
            const emptyEl = document.getElementById('emptyState');
            const currentMembers = membersByTime[currentTab];

            listEl.innerHTML = '';
            countEl.textContent = currentMembers.length;

            if (currentMembers.length === 0) {
                listEl.appendChild(emptyEl);
                emptyEl.classList.remove('hidden');
                return;
            }

            currentMembers.forEach((m, idx) => {
                const item = document.createElement('div');
                item.className = "flex items-center justify-between mb-3 p-3 bg-gray-50 rounded-xl animate-fade-in";
                item.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="w-6 h-6 flex items-center justify-center bg-white rounded-lg text-[10px] font-bold text-gray-400 border border-gray-100">${idx + 1}</span>
                        <div>
                            <p class="text-sm font-bold text-gray-800">${m.name}</p>
                            <p class="text-[10px] text-blue-500 font-bold">${m.role}</p>
                        </div>
                    </div>
                    <button onclick="removeMember('${idx}')" class="text-gray-300 hover:text-red-500 transition">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                `;
                listEl.appendChild(item);
            });
        }

        function addManualMember() {
            const input = document.getElementById('manualInput');
            if (!input.value.trim()) return;

            membersByTime[currentTab].push({
                name: input.value.trim(),
                role: "직접추가",
                score: 1.0
            });

            input.value = '';
            renderList();
        }

        async function handleOCR(event) {
            const file = event.target.files[0];
            if (!file) return;

            // 로딩 상태 표시
            const btn = document.querySelector('label[for="ocrUpload"] span');
            const originalText = btn.textContent;
            btn.textContent = "분석 중...";

            try {
                // 실제 배포 환경에서는 FormData를 사용하여 이미지 파일을 서버로 전송합니다.
                // 여기서는 시뮬레이션을 위해 /api/check 호출 구조만 보여줍니다.
                const formData = new FormData();
                formData.append('image', file);

                // 시뮬레이션 응답 (실제 서버 연결 시 fetch 사용)
                // const response = await fetch('/api/ocr', { method: 'POST', body: formData });
                // const data = await response.json();
                
                // 가짜 데이터 응답 예시
                const mockData = [
                    { name: "아빠곰", role: "운영진", score: 0.98 },
                    { name: "엄마곰", role: "멤버", score: 0.85 }
                ];

                mockData.forEach(m => {
                    if (!membersByTime[currentTab].some(existing => existing.name === m.name)) {
                        membersByTime[currentTab].push(m);
                    }
                });
                
                renderList();
                showToast("스캔 및 보정이 완료되었습니다.");
            } catch (err) {
                alert("OCR 분석 실패: " + err.message);
            } finally {
                btn.textContent = originalText;
                event.target.value = '';
            }
        }

        function removeMember(idx) {
            membersByTime[currentTab].splice(idx, 1);
            renderList();
        }

        function clearList() {
            if(confirm("현재 시간대의 명단을 모두 삭제하시겠습니까?")) {
                membersByTime[currentTab] = [];
                renderList();
            }
        }

        function copyToClipboard() {
            const currentMembers = membersByTime[currentTab];
            if (currentMembers.length === 0) return;

            const text = `${currentTab} 요새전 참여 명단\n` + 
                         currentMembers.map((m, i) => `${i+1}. ${m.name}`).join('\n');
            
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);

            showToast("명단이 복사되었습니다!");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
                toast.classList.remove('opacity-100');
            }, 2000);
        }

        function openMasterList() {
            alert("마스터 명단 편집 기능은 준비 중입니다.");
        }

        // 초기화
        renderList();
    </script>
</body>
</html>
