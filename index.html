<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOS Fortress Tracker</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #1a202c; color: white; }
        .loading-spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const CONFIG = {
            GAS_URL: "https://script.google.com/macros/s/AKfycbzwxitJHULZRrKJjCtMJNHZIVW69V1dWRvZfzQ-EJ5TUOlCxl5PLo9py_pF__KxQlRH/exec",
            GEMINI_API_KEY: "AQ.Ab8RN6IzSKGEzd8SX74VJ4dch28_QBlbWRmFSgJRCAnFIwjBQw"
        };

        function App() {
            const [masterList, setMasterList] = useState([]);
            const [scannedList, setScannedList] = useState([]);
            const [loading, setLoading] = useState(false);
            const [view, setView] = useState('main');

            const fetchMaster = () => {
                fetch(CONFIG.GAS_URL)
                    .then(res => res.json())
                    .then(data => setMasterList(data))
                    .catch(err => console.error("데이터 로드 실패:", err));
            };

            useEffect(() => { fetchMaster(); }, []);

            const fileToBuffer = (file) => new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result.split(',')[1]);
                reader.readAsDataURL(file);
            });

            const handleFileUpload = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                setLoading(true);
                try {
                    let allExtractedNames = [];
                    for (const file of files) {
                        const base64Image = await fileToBuffer(file);
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${CONFIG.GEMINI_API_KEY}`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                contents: [{
                                    parts: [
                                        { text: "이미지 속 게임 유저들의 닉네임을 추출해줘. [GOM] 같은 연맹 태그는 제외해. 결과는 오직 JSON 형식으로만 답해. 예: {\"names\": [\"닉네임1\", \"닉네임2\"]}" },
                                        { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                                    ]
                                }]
                            })
                        });

                        const result = await response.json();
                        if (result.candidates) {
                            const text = result.candidates[0].content.parts[0].text;
                            const jsonMatch = text.match(/\{.*\}/s);
                            if (jsonMatch) {
                                allExtractedNames = [...allExtractedNames, ...JSON.parse(jsonMatch[0]).names];
                            }
                        }
                    }

                    const uniqueNames = [...new Set(allExtractedNames)];
                    const results = uniqueNames.map(name => {
                        const info = masterList.find(m => m.name === name);
                        return info ? { name, role: info.role, grade: info.grade } : { name, role: "미등록", grade: "-" };
                    });

                    setScannedList(results);

                    // 구글 시트 저장 (no-cors 모드로 보안 차단 우회)
                    fetch(CONFIG.GAS_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "text/plain" },
                        body: JSON.stringify({ action: "saveLog", data: results })
                    });
                    
                    alert("분석이 완료되었습니다!");
                } catch (error) {
                    alert("오류가 발생했습니다: " + error.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="max-w-md mx-auto p-4 min-h-screen">
                    <header className="flex justify-between items-center mb-6 py-2 border-b border-gray-700">
                        <h1 className="text-xl font-bold text-blue-400">WOS Tracker</h1>
                        <button onClick={() => setView(view === 'main' ? 'manage' : 'main')} className="text-sm bg-gray-700 px-3 py-1 rounded">
                            {view === 'main' ? '명단 관리' : '홈으로'}
                        </button>
                    </header>

                    {loading && (
                        <div className="fixed inset-0 bg-black/70 flex flex-col items-center justify-center z-50">
                            <div className="loading-spinner mb-4"></div>
                            <p className="text-lg">AI가 명단을 분석 중입니다...</p>
                        </div>
                    )}

                    {view === 'main' ? (
                        <div className="space-y-4">
                            <div className="border-2 border-dashed border-gray-600 p-10 text-center rounded-xl bg-gray-800/50 hover:border-blue-500 transition-all">
                                <input type="file" multiple onChange={handleFileUpload} className="hidden" id="fileInput" accept="image/*" />
                                <label htmlFor="fileInput" className="cursor-pointer block">
                                    <div className="text-4xl mb-2">📸</div>
                                    <p className="font-bold text-gray-300">스크린샷 업로드</p>
                                </label>
                            </div>
                            
                            <div className="bg-gray-800 p-4 rounded-xl border border-gray-700">
                                <h2 className="mb-3 font-bold flex justify-between">
                                    <span>참여 명단</span>
                                    <span className="text-blue-400">{scannedList.length}명</span>
                                </h2>
                                <div className="space-y-2 text-sm max-h-[400px] overflow-y-auto">
                                    {scannedList.map((p, i) => (
                                        <div key={i} className="flex justify-between p-2 bg-gray-700/50 rounded">
                                            <span>{i+1}. <strong>{p.name}</strong></span>
                                            <span className="text-xs px-2 py-0.5 bg-gray-600 rounded text-gray-300">{p.role}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="bg-gray-800 p-4 rounded-xl border border-gray-700">
                            <h2 className="mb-4 font-bold text-orange-400">마스터 리스트 ({masterList.length}명)</h2>
                            <div className="space-y-2 max-h-[500px] overflow-y-auto">
                                {masterList.map((m, i) => (
                                    <div key={i} className="flex justify-between text-sm border-b border-gray-700 pb-2">
                                        <span className="font-bold">{m.name}</span>
                                        <span className="bg-blue-900/50 text-blue-300 px-2 py-0.5 rounded text-xs">{m.role}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
