<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOS Tracker Pro - Final</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .loading-spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const CONFIG = {
            GAS_URL: "https://script.google.com/macros/s/AKfycbxM8qa36ZkYfNjHBDAcB9yQQHh7CESM4T5-B_n6pmHqGqxHiMyUxoH_igCrWHuKDU5m/exec",
            GEMINI_API_KEY: "AIzaSyCVgqua6AyL-IWFhO68gxRHb5JY8aJd8H4" 
        };

        function App() {
            const [masterList, setMasterList] = useState([]);
            const [scannedList, setScannedList] = useState([]);
            const [loading, setLoading] = useState(false);
            const [loadingMsg, setLoadingMsg] = useState("");
            const [view, setView] = useState('main');

            useEffect(() => {
                fetch(CONFIG.GAS_URL)
                    .then(res => res.json())
                    .then(data => setMasterList(Array.isArray(data) ? data : []))
                    .catch(e => console.error("명단 로드 실패"));
            }, []);

            const handleFileUpload = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                setLoading(true);
                let allNames = [];
                
                try {
                    for (const file of files) {
                        setLoadingMsg("AI 서버로 사진 배달 중...");
                        const reader = new FileReader();
                        const base64 = await new Promise(resolve => {
                            reader.onload = () => resolve(reader.result.split(',')[1]);
                            reader.readAsDataURL(file);
                        });

                        // 404 에러 방지를 위한 최신 API 호출 주소 구조
                        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${CONFIG.GEMINI_API_KEY}`;

                        const response = await fetch(apiUrl, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                contents: [{
                                    parts: [
                                        { text: "이 이미지는 '화이트아웃 서바이벌' 연맹 화면이야. [GOM] 태그 뒤에 있는 닉네임들만 찾아서 JSON으로 줘. 형식: {\"names\": [\"이름1\", \"이름2\"]}" },
                                        { inline_data: { mime_type: "image/jpeg", data: base64 } }
                                    ]
                                }]
                            })
                        });

                        if (!response.ok) throw new Error(`서버 응답 오류: ${response.status}`);

                        const result = await response.json();
                        const text = result.candidates?.[0]?.content?.parts?.[0]?.text || "";
                        const jsonMatch = text.match(/\{[\s\S]*\}/);
                        
                        if (jsonMatch) {
                            const parsed = JSON.parse(jsonMatch[0]);
                            if (parsed.names) allNames = [...allNames, ...parsed.names];
                        }
                    }

                    const finalResults = allNames.map(name => {
                        const clean = name.trim();
                        const match = masterList.find(m => clean.includes(m.name.trim()) || m.name.trim().includes(clean));
                        return match ? { ...match } : { name: clean, role: "미등록" };
                    });

                    setScannedList(finalResults);
                    
                    // GAS 저장 (No-Cors 모드)
                    fetch(CONFIG.GAS_URL, {
                        method: "POST",
                        mode: "no-cors",
                        body: JSON.stringify({ action: "saveLog", data: finalResults })
                    });

                    alert(`${finalResults.length}명을 찾았습니다!`);
                } catch (error) {
                    console.error(m);
                    alert("AI 연결에 실패했습니다. 주소나 키를 확인해주세요.");
                } finally {
                    setLoading(false);
                    setLoadingMsg("");
                }
            };

            return (
                <div className="max-w-md mx-auto p-4 min-h-screen">
                    <header className="flex justify-between items-center mb-6 py-4 border-b border-slate-700">
                        <h1 className="text-xl font-bold text-blue-400">WOS Tracker Pro</h1>
                        <button onClick={() => setView(view === 'main' ? 'manage' : 'main')} className="bg-slate-800 px-3 py-1 rounded-lg text-sm">
                            {view === 'main' ? '명단 관리' : '홈으로'}
                        </button>
                    </header>

                    {loading && (
                        <div className="fixed inset-0 bg-black/90 flex flex-col items-center justify-center z-50">
                            <div className="loading-spinner mb-4"></div>
                            <p className="text-blue-400 font-bold">{loadingMsg}</p>
                        </div>
                    )}

                    {view === 'main' ? (
                        <div className="space-y-4">
                            <div className="glass-card p-12 text-center rounded-3xl border-2 border-dashed border-slate-600 relative">
                                <input type="file" multiple onChange={handleFileUpload} className="absolute inset-0 opacity-0 cursor-pointer" accept="image/*" />
                                <p className="text-4xl mb-3">📸</p>
                                <p className="font-bold">스크린샷 업로드</p>
                            </div>
                            
                            <div className="glass-card rounded-2xl overflow-hidden">
                                <div className="p-4 bg-slate-800/50 flex justify-between border-b border-slate-700">
                                    <span className="font-bold">스캔 결과 ({scannedList.length})</span>
                                    <button onClick={() => setScannedList([])} className="text-xs text-red-400">지우기</button>
                                </div>
                                <div className="max-h-[400px] overflow-y-auto">
                                    {scannedList.length === 0 ? (
                                        <p className="p-10 text-center text-slate-500">사진을 올려주세요.</p>
                                    ) : (
                                        scannedList.map((p, i) => (
                                            <div key={i} className="flex justify-between p-4 border-b border-slate-800/50 items-center">
                                                <span>{p.name}</span>
                                                <span className={`text-[10px] px-2 py-1 rounded ${p.role === '미등록' ? 'bg-red-900/30 text-red-400' : 'bg-blue-900/30 text-blue-400'}`}>{p.role}</span>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="glass-card rounded-2xl p-4">
                            <h2 className="font-bold mb-4 text-orange-400">마스터 명단 ({masterList.length}명)</h2>
                            <div className="max-h-[500px] overflow-y-auto space-y-2">
                                {masterList.map((m, i) => (
                                    <div key={i} className="flex justify-between text-sm p-2 bg-slate-800/30 rounded">
                                        <span>{m.name}</span>
                                        <span className="text-slate-500">{m.role}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
