<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOS Tracker Pro - V3.1</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background: #0f172a; color: #f1f5f9; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const CONFIG = {
            GAS_URL: "https://script.google.com/macros/s/AKfycbxM8qa36ZkYfNjHBDAcB9yQQHh7CESM4T5-B_n6pmHqGqxHiMyUxoH_igCrWHuKDU5m/exec",
            // ★ 반드시 새로 발급받은 정상적인 API 키를 입력하세요!
            API_KEY: "여기에_새로_발급받은_키_넣기" 
        };

        function App() {
            const [masterList, setMasterList] = useState([]);
            const [scannedList, setScannedList] = useState([]);
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                fetch(CONFIG.GAS_URL)
                    .then(r => r.json())
                    .then(d => setMasterList(d))
                    .catch(e => console.error("명단 로드 실패"));
            }, []);

            const runAI = async (e) => {
                const files = Array.from(e.target.files);
                if (!files.length) return;

                setLoading(true);
                let newRawNames = [];

                try {
                    for (const file of files) {
                        const reader = new FileReader();
                        const base64 = await new Promise(r => {
                            reader.onload = () => r(reader.result.split(',')[1]);
                            reader.readAsDataURL(file);
                        });

                        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${CONFIG.API_KEY}`;
                        
                        const response = await fetch(API_URL, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                contents: [{
                                    parts: [
                                        { text: "이 이미지에서 [GOM] 태그 뒤의 닉네임들을 추출해서 JSON 배열로 응답해줘. 예: {\"names\": [\"닉네임1\", \"닉네임2\"]}" },
                                        { inline_data: { mime_type: "image/jpeg", data: base64 } }
                                    ]
                                }]
                            })
                        });

                        const resData = await response.json();
                        const text = resData.candidates?.[0]?.content?.parts?.[0]?.text || "";
                        const match = text.match(/\{.*\}/s);
                        if (match) {
                            const parsed = JSON.parse(match[0]);
                            if (parsed.names) newRawNames = [...newRawNames, ...parsed.names];
                        }
                    }

                    const processed = newRawNames.map(name => {
                        const clean = name.trim();
                        const found = masterList.find(m => clean.includes(m.name) || m.name.includes(clean));
                        return found ? { ...found } : { name: clean, role: "미등록" };
                    });

                    // ★ 핵심: 기존 리스트(prev)에 합치고 중복 제거
                    setScannedList(prev => {
                        const combined = [...prev, ...processed];
                        return combined.filter((item, index, self) =>
                            index === self.findIndex((t) => t.name === item.name)
                        );
                    });

                    alert(`${files.length}장의 사진 분석 완료!`);

                } catch (err) {
                    console.error(err);
                    alert("분석 중 오류가 발생했습니다. API 키를 확인하세요.");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen p-4 flex flex-col">
                    <header className="py-6 text-center">
                        <h1 className="text-2xl font-bold text-blue-400 tracking-tight">WOS TRACKER PRO</h1>
                        <p className="text-[10px] text-green-400 font-bold uppercase tracking-widest">Version 3.1 - Cumulative Mode</p>
                    </header>

                    <main className="flex-1 space-y-4">
                        <div className="glass p-10 rounded-3xl text-center relative border-2 border-dashed border-slate-700 hover:border-blue-500 transition-all">
                            <input type="file" multiple onChange={runAI} className="absolute inset-0 opacity-0 cursor-pointer z-10" />
                            <div className="text-4xl mb-2">📸</div>
                            <p className="text-sm font-bold text-slate-300">스크린샷 추가 업로드</p>
                            <p className="text-[10px] text-slate-500 mt-1">사진을 올릴수록 명단이 누적됩니다.</p>
                        </div>

                        {loading && <div className="text-center text-blue-400 animate-pulse text-xs italic">AI가 사진을 읽고 있습니다...</div>}

                        <div className="glass rounded-2xl overflow-hidden">
                            <div className="p-4 bg-slate-800/50 flex justify-between border-b border-white/5">
                                <span className="text-xs font-bold text-slate-400 uppercase">스캔 결과 ({scannedList.length}명)</span>
                                <button onClick={() => { if(confirm("명단을 초기화할까요?")) setScannedList([]) }} className="text-[10px] text-red-500 font-bold">전체 삭제</button>
                            </div>
                            <div className="max-h-[400px] overflow-y-auto">
                                {scannedList.length === 0 ? (
                                    <p className="p-16 text-center text-slate-600 text-xs italic">사진을 올려 명단을 쌓아보세요.</p>
                                ) : (
                                    scannedList.map((p, i) => (
                                        <div key={i} className="flex justify-between p-4 border-b border-white/5 items-center">
                                            <span className="text-sm font-medium">{p.name}</span>
                                            <span className={`text-[9px] px-
