<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOS Tracker Pro - V3.8 Success Path</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background: #0f172a; color: #f1f5f9; margin: 0; padding: 0; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const CONFIG = {
            GAS_URL: "https://script.google.com/macros/s/AKfycbxM8qa36ZkYfNjHBDAcB9yQQHh7CESM4T5-B_n6pmHqGqxHiMyUxoH_igCrWHuKDU5m/exec",
            API_KEY: "AIzaSyCFYQu5FBCEXhc0OLonW8EfaMwGMJLLvbo"
        };

        function App() {
            const [masterList, setMasterList] = useState([]);
            const [scannedList, setScannedList] = useState([]);
            const [loading, setLoading] = useState(false);
            const [statusMsg, setStatusMsg] = useState("");

            useEffect(() => {
                fetch(CONFIG.GAS_URL)
                    .then(r => r.json())
                    .then(d => setMasterList(d))
                    .catch(e => console.error("명단 로드 실패"));
            }, []);

            const runAI = async (e) => {
                const files = Array.from(e.target.files);
                if (!files.length) return;

                setLoading(true);
                setStatusMsg("분석 시작...");
                
                let allExtractedNames = [];

                try {
                    for (let file of files) {
                        const base64Data = await new Promise(resolve => {
                            const reader = new FileReader();
                            reader.onload = () => resolve(reader.result.split(',')[1]);
                            reader.readAsDataURL(file);
                        });

                        // ★ [성공 공식 적용] gemini-2.5-flash 모델로 404 에러 원천 봉쇄
                        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${CONFIG.API_KEY}`;
                        
                        const response = await fetch(API_URL, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                contents: [{
                                    parts: [
                                        { text: "Find nicknames behind [GOM] and return as JSON: {\"names\": []}" },
                                        { inline_data: { mime_type: "image/jpeg", data: base64Data } }
                                    ]
                                }]
                            })
                        });

                        const resData = await response.json();
                        if (resData.error) throw new Error(resData.error.message);

                        const aiText = resData.candidates?.[0]?.content?.parts?.[0]?.text || "";
                        const jsonMatch = aiText.match(/\{.*\}/s);
                        if (jsonMatch) {
                            const parsed = JSON.parse(jsonMatch[0]);
                            if (parsed.names) allExtractedNames = [...allExtractedNames, ...parsed.names];
                        }
                    }

                    // 마스터 대조 및 누적 로직
                    const processedData = allExtractedNames.map(name => {
                        const cleanName = name.trim();
                        const match = masterList.find(m => cleanName.includes(m.name) || m.name.includes(cleanName));
                        return match ? { ...match } : { name: cleanName, role: "미등록" };
                    });

                    setScannedList(prev => {
                        const combined = [...prev, ...processedData];
                        return combined.filter((item, index, self) =>
                            index === self.findIndex((t) => t.name === item.name)
                        );
                    });

                    setStatusMsg("완료!");
                } catch (err) {
                    alert("에러: " + err.message);
                    setStatusMsg("오류");
                } finally {
                    setLoading(false);
                    setTimeout(() => setStatusMsg(""), 3000);
                }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen p-4 flex flex-col">
                    <header className="py-8 text-center">
                        <h1 className="text-3xl font-bold text-blue-400 tracking-tighter" style={{fontFamily: 'Orbitron'}}>WOS TRACKER PRO</h1>
                        <p className="text-[10px] text-green-400 font-bold uppercase tracking-[0.2em] mt-1">Version 3.8 - 2.5 Engine Verified</p>
                    </header>

                    <main className="flex-1 space-y-6">
                        <div className="glass p-10 rounded-[2rem] text-center relative border-2 border-dashed border-slate-700 hover:border-blue-500 transition-all group">
                            <input type="file" multiple onChange={runAI} className="absolute inset-0 opacity-0 cursor-pointer z-10" />
                            <div className="text-5xl mb-3 group-hover:scale-110 transition-transform">📸</div>
                            <p className="text-sm font-bold text-slate-300">스크린샷 업로드 (누적 가능)</p>
                        </div>

                        {loading && <div className="text-center text-blue-400 text-xs animate-pulse font-bold">{statusMsg}</div>}

                        <div className="glass rounded-[1.5rem] overflow-hidden">
                            <div className="p-4 bg-slate-800/80 flex justify-between items-center border-b border-white/5">
                                <span className="text-xs font-bold text-slate-400 uppercase tracking-wider">결과 ({scannedList.length}명)</span>
                                <button onClick={() => setScannedList([])} className="text-[10px] text-red-500 font-bold">전체 삭제</button>
                            </div>
                            <div className="max-h-[400px] overflow-y-auto custom-scroll">
                                {scannedList.map((p, i) => (
                                    <div key={i} className="flex justify-between p-4 border-b border-white/5 items-center hover:bg-white/5 transition-colors">
                                        <span className="text-sm font-medium">{p.name}</span>
                                        <span className={`text-[9px] font-bold px-2 py-1 rounded-full border ${p.role === '미등록' ? 'border-red-500/50 text-red-400' : 'border-blue-500/50 text-blue-400'}`}>{p.role}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </main>
                    <footer className="py-6 text-center text-[10px] text-slate-600 uppercase tracking-widest font-bold">WOS Fortress System</footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
