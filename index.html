<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOS Tracker Pro - Final Fixed</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .loading-spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const CONFIG = {
            // 구글 앱스 스크립트 주소
            GAS_URL: "https://script.google.com/macros/s/AKfycbxM8qa36ZkYfNjHBDAcB9yQQHh7CESM4T5-B_n6pmHqGqxHiMyUxoH_igCrWHuKDU5m/exec",
            // Gemini API Key
            GEMINI_API_KEY: "AIzaSyCVgqua6AyL-IWFhO68gxRHb5JY8aJd8H4" 
        };

        function App() {
            const [masterList, setMasterList] = useState([]);
            const [scannedList, setScannedList] = useState([]);
            const [loading, setLoading] = useState(false);
            const [loadingMsg, setLoadingMsg] = useState("");
            const [view, setView] = useState('main');

            // 마스터 명단 가져오기
            useEffect(() => {
                fetch(CONFIG.GAS_URL)
                    .then(res => res.json())
                    .then(data => setMasterList(Array.isArray(data) ? data : []))
                    .catch(err => console.error("명단 로딩 실패:", err));
            }, []);

            const handleFileUpload = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                setLoading(true);
                setLoadingMsg("AI 분석을 시작합니다...");
                let allExtractedNames = [];
                
                try {
                    for (let i = 0; i < files.length; i++) {
                        setLoadingMsg(`${i + 1}번 사진을 읽는 중...`);
                        
                        const reader = new FileReader();
                        const base64Image = await new Promise((resolve) => {
                            reader.onload = () => resolve(reader.result.split(',')[1]);
                            reader.readAsDataURL(files[i]);
                        });

                        // [중요] 404 에러를 방지하는 정식 API 주소 구조입니다.
                        const apiUrl = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${CONFIG.GEMINI_API_KEY}`;

                        const response = await fetch(apiUrl, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                contents: [{
                                    parts: [
                                        { text: "이 이미지에서 '[GOM]' 연맹 태그 뒤에 나오는 게임 닉네임들만 모두 추출해줘. JSON 형식으로만 답해줘: {\"names\": [\"닉네임1\", \"닉네임2\"]}" },
                                        { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                                    ]
                                }]
                            })
                        });

                        if (!response.ok) {
                            throw new Error(`API 응답 오류 (상태코드: ${response.status})`);
                        }

                        const result = await response.json();
                        const rawText = result.candidates?.[0]?.content?.parts?.[0]?.text || "";
                        
                        // JSON만 골라내기
                        const jsonMatch = rawText.match(/\{[\s\S]*\}/);
                        if (jsonMatch) {
                            const parsed = JSON.parse(jsonMatch[0]);
                            if (parsed.names) {
                                allExtractedNames = [...allExtractedNames, ...parsed.names];
                            }
                        }
                    }

                    if (allExtractedNames.length === 0) {
                        alert("사진에서 닉네임을 찾지 못했습니다. 태그가 포함된 화면인지 확인해주세요!");
                    } else {
                        const uniqueNames = [...new Set(allExtractedNames.map(n => n.trim()))];
                        const matchedResults = uniqueNames.map(name => {
                            const match = masterList.find(m => name.includes(m.name.trim()) || m.name.trim().includes(name));
                            return match ? { ...match } : { name, role: "미등록" };
                        });

                        setScannedList(matchedResults);
                        
                        // 구글 시트에 자동 저장
                        fetch(CONFIG.GAS_URL, {
                            method: "POST",
                            mode: "no-cors",
                            body: JSON.stringify({ action: "saveLog", data: matchedResults })
                        });

                        alert(`성공! 총 ${uniqueNames.length}명을 확인했습니다.`);
                    }

                } catch (error) {
                    console.error("발생한 에러:", error); // m이 아니라 error로 수정 완료!
                    alert(`오류 발생: ${error.message}\nAPI 키나 주소를 다시 확인해주세요.`);
                } finally {
                    setLoading(false);
                    setLoadingMsg("");
                }
            };

            return (
                <div className="max-w-md mx-auto p-4 min-h-screen">
                    <header className="flex justify-between items-center mb-6 py-4 border-b border-slate-700">
                        <h1 className="text-xl font-bold text-blue-400">WOS Tracker Pro</h1>
                        <button onClick={() => setView(view === 'main' ? 'manage' : 'main')} className="bg-slate-800 px-3 py-1 rounded-lg text-xs">
                            {view === 'main' ? '명단 관리' : '홈으로'}
                        </button>
                    </header>

                    {loading && (
                        <div className="fixed inset-0 bg-black/90 flex flex-col items-center justify-center z-50">
                            <div className="loading-spinner mb-4"></div>
                            <p className="font-bold text-blue-400">{loadingMsg}</p>
                        </div>
                    )}

                    {view === 'main' ? (
                        <div className="space-y-4">
                            <div className="glass-card p-12 text-center rounded-3xl border-2 border-dashed border-slate-600 relative hover:border-blue-500 transition-all">
                                <input type="file" multiple onChange={handleFileUpload} className="absolute inset-0 opacity-0 cursor-pointer" accept="image/*" />
                                <div className="text-4xl mb-2">📸</div>
                                <p className="font-bold">스크린샷 업로드</p>
                                <p className="text-xs text-slate-500 mt-2">집결 부대 명단 화면을 올려주세요</p>
                            </div>
                            
                            <div className="glass-card rounded-2xl overflow-hidden">
                                <div className="p-4 bg-slate-800/50 flex justify-between items-center border-b border-slate-700">
                                    <span className="font-bold">스캔 결과 ({scannedList.length})</span>
                                    <button onClick={() => setScannedList([])} className="text-xs text-red-400">초기화</button>
                                </div>
                                <div className="max-h-[400px] overflow-y-auto">
                                    {scannedList.length === 0 ? (
                                        <div className="p-12 text-center text-slate-500 text-sm">분석된 데이터가 없습니다.</div>
                                    ) : (
                                        scannedList.map((p, i) => (
                                            <div key={i} className="flex justify-between p-4 border-b border-slate-800/50 items-center animate-fadeIn">
                                                <span className="text-sm">{p.name}</span>
                                                <span className={`text-[10px] px-2 py-1 rounded-full ${p.role === '미등록' ? 'bg-red-900/30 text-red-400' : 'bg-blue-900/30 text-blue-400'}`}>
                                                    {p.role}
                                                </span>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="glass-card rounded-2xl p-4">
                            <h2 className="font-bold text-orange-400 mb-4 border-b border-slate-700 pb-2">마스터 명단 ({masterList.length})</h2>
                            <div className="max-h-[500px] overflow-y-auto space-y-1">
                                {masterList.map((m, i) => (
                                    <div key={i} className="flex justify-between p-2 hover:bg-slate-800/50 rounded transition">
                                        <span className="text-sm font-medium">{m.name}</span>
                                        <span className="text-xs text-slate-500">{m.role}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
