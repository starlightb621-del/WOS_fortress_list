<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOS 명단관리 PRO - 스마트 편집형</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes loading-bar { 0% { left: -40%; } 100% { left: 100%; } }
        .animate-loading-bar { position: relative; animation: loading-bar 2s infinite ease-in-out; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        body { background-color: #f0f9ff; margin: 0; padding: 0; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        const CONFIG = {
            GAS_URL: "https://script.google.com/macros/s/AKfycbxcCpXhhu8_ZDW0BaJEtzVkNvJ1K7biHOhdGkba3Eds4h5UDoXEvY9vToE5B_8tezD8/exec",
            API_KEY: "AIzaSyAgezV6j6tCs-7j39pA32FSVLgHy6rduFI", 
            MODEL_NAME: "gemini-1.5-flash" 
        };

        const Icon = ({ name, size = 18, className = "" }) => {
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const App = () => {
            const [view, setView] = useState('main'); 
            const [masterList, setMasterList] = useState([]);
            const [scannedData, setScannedData] = useState({ "12시": [], "18시": [], "21시": [] });
            const [activeTime, setActiveTime] = useState("12시");
            const [loading, setLoading] = useState(false);
            const [statusMsg, setStatusMsg] = useState("");
            const [isSyncing, setIsSyncing] = useState(false);
            const [newName, setNewName] = useState(""); 
            const [editingIndex, setEditingIndex] = useState(null); 
            const fileInputRef = useRef(null);

            useEffect(() => { 
                fetchMasterData();
                lucide.createIcons();
            }, []);

            useEffect(() => { lucide.createIcons(); }, [view, scannedData, loading, activeTime, editingIndex]);

            const fetchMasterData = async () => {
                setIsSyncing(true);
                try {
                    const response = await fetch(CONFIG.GAS_URL);
                    const data = await response.json();
                    setMasterList(data);
                } catch (e) { console.error("데이터 로드 실패"); }
                finally { setIsSyncing(false); }
            };

            const syncToSheet = async (updatedData) => {
                setIsSyncing(true);
                try {
                    await fetch(CONFIG.GAS_URL, { method: 'POST', body: JSON.stringify(updatedData) });
                    setStatusMsg("저장 완료");
                } catch (e) { setStatusMsg("저장 실패"); }
                finally { setIsSyncing(false); setTimeout(() => setStatusMsg(""), 2000); }
            };

            // [추가] 문자열 정제 함수: [GOM] 태그 및 특수문자 제거
            const normalize = (text) => {
                if (!text) return "";
                return text.replace(/\[.*?\]/g, '') // [GOM] 등 대괄호 태그 제거
                           .replace(/[^가-힣a-zA-Z0-9]/g, '') // 한글, 영문, 숫자 외 제거
                           .trim();
            };

            const getSimilarity = (s1, s2) => {
                const str1 = normalize(s1);
                const str2 = normalize(s2);
                if (!str1 || !str2) return 0;
                
                const len1 = str1.length, len2 = str2.length;
                const matrix = Array(len1 + 1).fill(null).map(() => Array(len2 + 1).fill(null));
                for (let i = 0; i <= len1; i++) matrix[i][0] = i;
                for (let j = 0; j <= len2; j++) matrix[0][j] = j;
                for (let i = 1; i <= len1; i++) {
                    for (let j = 1; j <= len2; j++) {
                        const cost = str1[i - 1] === str2[j - 1] ? 0 : 1;
                        matrix[i][j] = Math.min(matrix[i - 1][j] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j - 1] + cost);
                    }
                }
                return 1 - matrix[len1][len2] / Math.max(len1, len2);
            };

            // 보정 로직 통합 함수
            const getBestMatchedUser = (rawName) => {
                let best = { name: rawName.trim(), role: "본캐", score: 0 };
                masterList.forEach(m => {
                    const s = getSimilarity(rawName, m.name);
                    // 50% 이상 유사하면 마스터 명단의 정식 이름으로 매칭
                    if (s > best.score && s > 0.5) {
                        best = { ...m, score: s };
                    }
                });
                return best;
            };

            const handleAddName = () => {
                if (!newName.trim()) return;
                const best = getBestMatchedUser(newName);
                const updatedList = [...scannedData[activeTime], best];
                const unique = updatedList.filter((v, i, a) => a.findIndex(t => t.name === v.name) === i);
                const next = { ...scannedData, [activeTime]: unique };
                setScannedData(next);
                syncToSheet(next);
                setNewName("");
            };

            const handleEditComplete = (index, val) => {
                const updatedList = [...scannedData[activeTime]];
                updatedList[index] = getBestMatchedUser(val);
                const next = { ...scannedData, [activeTime]: updatedList };
                setScannedData(next);
                syncToSheet(next);
                setEditingIndex(null);
            };

            const runAI = async (e) => {
                const files = Array.from(e.target.files);
                if (!files.length) return;
                setLoading(true); setStatusMsg("AI 분석 및 보정 중...");
                
                let allExtractedNames = [];
                try {
                    for (let file of files) {
                        const base64Data = await new Promise(resolve => {
                            const reader = new FileReader();
                            reader.onload = () => resolve(reader.result.split(',')[1]);
                            reader.readAsDataURL(file);
                        });

                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${CONFIG.MODEL_NAME}:generateContent?key=${CONFIG.API_KEY}`, {
                            method: "POST", headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ contents: [{ parts: [
                                { text: "이 이미지에서 연맹 전쟁(Rally)에 참여한 캐릭터 닉네임들을 정확히 추출해줘. [GOM]과 같은 연맹태그나 '도착 완료' 같은 상태 메시지는 제외하고 캐릭터 이름만 추출해서 JSON 배열로 만들어줘: {\"names\": [\"이름1\", \"이름2\"]}" },
                                { inlineData: { mimeType: "image/jpeg", data: base64Data } }
                            ]}]})
                        });
                        const resData = await response.json();
                        const aiText = resData.candidates?.[0]?.content?.parts?.[0]?.text || "";
                        const jsonMatch = aiText.match(/\{.*\}/s);
                        if (jsonMatch) {
                            const parsed = JSON.parse(jsonMatch[0]);
                            if (parsed.names) allExtractedNames = [...allExtractedNames, ...parsed.names];
                        }
                    }

                    // 마스터 명단과 대조하여 보정
                    const processed = allExtractedNames.map(raw => getBestMatchedUser(raw));

                    setScannedData(prev => {
                        const combined = [...prev[activeTime], ...processed];
                        // 이름 기준으로 중복 제거
                        const unique = combined.filter((v, i, a) => a.findIndex(t => t.name === v.name) === i);
                        const next = { ...prev, [activeTime]: unique };
                        syncToSheet(next);
                        return next;
                    });
                } catch (err) { setStatusMsg("분석 오류 발생"); }
                finally { setLoading(false); }
            };

            const copyToClipboard = () => {
                const list = scannedData[activeTime];
                const text = `[${activeTime} 요새전 참여명단]\n` + list.map((p, i) => `${i+1}. ${p.name} (${p.role})`).join('\n');
                navigator.clipboard.writeText(text);
                setStatusMsg("복사 완료!");
                setTimeout(() => setStatusMsg(""), 2000);
            };

            if (view === 'admin') {
                return (
                    <div className="min-h-screen bg-white p-6">
                        <header className="flex items-center justify-between mb-8">
                            <button onClick={() => setView('main')} className="p-2 text-slate-500"><Icon name="chevron-left" size={24}/></button>
                            <h2 className="text-xl font-black">마스터 명단 ({masterList.length}명)</h2>
                            <div className="w-10"></div>
                        </header>
                        <div className="space-y-2">
                            {masterList.map((m, i) => (
                                <div key={i} className="flex justify-between p-3 bg-slate-50 rounded-xl border border-slate-100">
                                    <span className="font-bold">{m.name}</span>
                                    <span className="text-xs text-blue-500 font-black">{m.role}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col items-center p-4 relative overflow-x-hidden">
                    <div className="fixed inset-0 pointer-events-none">
                        <div className="absolute top-[-10%] right-[-10%] w-[70%] h-[60%] bg-blue-200/30 blur-[120px] rounded-full" />
                    </div>

                    <header className="w-full max-w-lg flex flex-col items-center mb-6 relative z-10">
                        <div className="flex items-center gap-2 px-4 py-1 rounded-full bg-white/80 border border-blue-200 shadow-sm mb-4">
                            <div className={`w-2 h-2 rounded-full ${isSyncing ? 'bg-amber-400 animate-pulse' : 'bg-blue-500'}`} />
                            <span className="text-[10px] font-black text-blue-600 tracking-widest">
                                {isSyncing ? 'SYNCING...' : 'CLOUD CONNECTED'}
                            </span>
                        </div>
                        <h1 className="text-3xl font-black text-slate-900 leading-none">
                            WOS 요새쟁탈 <span className="text-blue-600">명단 PRO</span>
                        </h1>
                    </header>

                    <nav className="w-full max-w-lg flex bg-white/60 backdrop-blur-xl p-1.5 rounded-3xl border border-white shadow-sm mb-6 relative z-10">
                        {["12시", "18시", "21시"].map((time) => (
                            <button key={time} onClick={() => setActiveTime(time)} className={`flex-1 py-3 rounded-2xl text-sm font-black transition-all ${activeTime === time ? "bg-gradient-to-br from-blue-600 to-sky-500 text-white shadow-lg" : "text-slate-400"}`}>
                                {time}
                            </button>
                        ))}
                    </nav>

                    <main className="w-full max-w-lg space-y-4 relative z-10">
                        <div className="bg-white/70 backdrop-blur-2xl rounded-[2rem] border border-white shadow-xl p-6">
                            <div className="flex gap-2 mb-4">
                                <input 
                                    type="text" 
                                    value={newName}
                                    onChange={(e) => setNewName(e.target.value)}
                                    placeholder="닉네임 직접 입력..."
                                    className="flex-1 bg-slate-100 border-none rounded-xl px-4 py-3 text-sm font-bold focus:ring-2 focus:ring-blue-400 outline-none"
                                    onKeyDown={(e) => e.key === 'Enter' && handleAddName()}
                                />
                                <button onClick={handleAddName} className="bg-blue-600 text-white px-4 rounded-xl font-black text-sm">추가</button>
                            </div>
                            <div onClick={() => fileInputRef.current.click()} className="border-2 border-dashed border-blue-100 rounded-2xl p-4 flex flex-col items-center cursor-pointer hover:bg-blue-50 transition-colors">
                                <input type="file" ref={fileInputRef} multiple onChange={runAI} className="hidden" />
                                {loading ? <Icon name="refresh-cw" className="animate-spin text-blue-500" /> : <div className="flex items-center gap-2 text-blue-500 font-black text-sm"><Icon name="camera" size={16} /> 스크린샷 스캔 (자동보정)</div>}
                            </div>
                        </div>

                        <div className="bg-white/80 backdrop-blur-2xl rounded-[2rem] border border-white shadow-xl overflow-hidden">
                            <div className="p-5 border-b border-blue-50 flex justify-between items-center bg-blue-50/20">
                                <span className="text-xs font-black text-slate-700">참여 명단 ({scannedData[activeTime].length}명)</span>
                                {statusMsg && <div className="text-[10px] font-bold text-blue-600 animate-bounce">{statusMsg}</div>}
                            </div>
                            <div className="max-h-[350px] overflow-y-auto px-4 py-2 custom-scroll">
                                {scannedData[activeTime].length === 0 ? (
                                    <div className="py-16 flex flex-col items-center opacity-20"><Icon name="shield-check" size={48} /><p className="text-xs mt-3 font-black">데이터가 없습니다</p></div>
                                ) : (
                                    <div className="space-y-2 py-2">
                                        {scannedData[activeTime].map((p, i) => (
                                            <div key={i} className="flex items-center justify-between p-3.5 bg-white border border-blue-50 rounded-2xl shadow-sm">
                                                <span className="text-[10px] font-black text-blue-300 w-4">{i + 1}</span>
                                                {editingIndex === i ? (
                                                    <input 
                                                        autoFocus
                                                        className="flex-1 text-sm font-black text-blue-600 ml-2 outline-none border-b-2 border-blue-400"
                                                        defaultValue={p.name}
                                                        onBlur={(e) => handleEditComplete(i, e.target.value)}
                                                        onKeyDown={(e) => e.key === 'Enter' && handleEditComplete(i, e.target.value)}
                                                    />
                                                ) : (
                                                    <span onClick={() => setEditingIndex(i)} className="flex-1 text-sm font-black text-slate-800 ml-2 cursor-pointer hover:text-blue-500">{p.name}</span>
                                                )}
                                                <span className={`text-[10px] font-black px-3 py-1 rounded-full ${p.role === '운영진' ? 'bg-amber-50 text-amber-600' : 'bg-blue-50 text-blue-600'}`}>{p.role}</span>
                                                <button onClick={() => {
                                                    const filtered = scannedData[activeTime].filter((_, idx) => idx !== i);
                                                    const next = {...scannedData, [activeTime]: filtered};
                                                    setScannedData(next); syncToSheet(next);
                                                }} className="ml-2 text-slate-300 hover:text-rose-500"><Icon name="trash-2" size={14}/></button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                            <div className="p-5 bg-blue-50/20 border-t border-blue-50 space-y-3">
                                <button onClick={copyToClipboard} className="w-full py-4 bg-gradient-to-r from-blue-600 to-sky-500 text-white rounded-2xl flex items-center justify-center gap-2 shadow-lg font-black">
                                    <Icon name="copy" /> 명단 복사하기
                                </button>
                                <div onClick={() => setView('admin')} className="text-center text-[11px] font-black text-blue-400 cursor-pointer flex items-center justify-center gap-1">
                                    <Icon name="settings" size={12} /> 마스터 명단 확인
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
