<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOS Fortress Tracker Pro</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .loading-spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const CONFIG = {
            // 1. 배포하신 GAS 주소 확인 (반드시 /exec로 끝나야 합니다)
            GAS_URL: "https://script.google.com/macros/s/AKfycbxM8qa36ZkYfNjHBDAcB9yQQHh7CESM4T5-B_n6pmHqGqxHiMyUxoH_igCrWHuKDU5m/exec",
            // 2. Gemini API Key
            GEMINI_API_KEY: "AIzaSyCVgqua6AyL-IWFhO68gxRHb5JY8aJd8H4" 
        };

        function App() {
            const [masterList, setMasterList] = useState([]);
            const [scannedList, setScannedList] = useState([]);
            const [loading, setLoading] = useState(false);
            const [loadingMsg, setLoadingMsg] = useState("");
            const [view, setView] = useState('main');

            // 마스터 명단 가져오기
            const fetchMaster = () => {
                setLoadingMsg("마스터 명단을 불러오는 중...");
                fetch(CONFIG.GAS_URL)
                    .then(res => res.json())
                    .then(data => {
                        setMasterList(Array.isArray(data) ? data : []);
                        setLoadingMsg("");
                    })
                    .catch(err => {
                        console.error("데이터 로드 실패:", err);
                        setLoadingMsg("명단 로드 실패 (GAS 설정을 확인하세요)");
                    });
            };

            useEffect(() => { fetchMaster(); }, []);

            const fileToBase64 = (file) => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });

            const handleFileUpload = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                setLoading(true);
                setLoadingMsg("AI가 이미지를 분석하고 있습니다...");
                
                try {
                    let allExtractedNames = [];
                    
                    for (let i = 0; i < files.length; i++) {
                        setLoadingMsg(`${i + 1}번째 이미지 분석 중...`);
                        const base64Image = await fileToBase64(files[i]);
                        
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${CONFIG.GEMINI_API_KEY}`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                contents: [{
                                    parts: [
                                        { text: "이미지 속 게임 캐릭터 닉네임들을 찾아줘. [연맹태그]는 무시하고 순수 닉네임만 추출해. 결과는 반드시 다른 설명 없이 오직 JSON 형식으로만 답해줘: {\"names\": [\"이름1\", \"이름2\"]}" },
                                        { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                                    ]
                                }]
                            })
                        });

                        const result = await response.json();
                        
                        if (result.candidates && result.candidates[0].content.parts[0].text) {
                            const rawText = result.candidates[0].content.parts[0].text;
                            // AI가 앞뒤에 붙인 불필요한 텍스트 제거 로직 강화
                            const jsonMatch = rawText.match(/\{[\s\S]*\}/);
                            if (jsonMatch) {
                                const parsed = JSON.parse(jsonMatch[0]);
                                if (parsed.names) {
                                    allExtractedNames = [...allExtractedNames, ...parsed.names];
                                }
                            }
                        }
                    }

                    // 중복 제거 및 마스터 명단 대조
                    const uniqueNames = [...new Set(allExtractedNames)];
                    const results = uniqueNames.map(name => {
                        const cleanName = name.trim();
                        const info = masterList.find(m => m.name.trim() === cleanName);
                        return info ? { ...info } : { name: cleanName, role: "미등록", grade: "-" };
                    });

                    setScannedList(results);
                    
                    // 구글 시트에 기록 저장
                    setLoadingMsg("구글 시트에 저장 중...");
                    await fetch(CONFIG.GAS_URL, {
                        method: "POST",
                        mode: "no-cors", // GAS POST를 위한 설정
                        body: JSON.stringify({ action: "saveLog", data: results })
                    });

                    setLoadingMsg("");
                    alert(`분석 완료! 총 ${uniqueNames.length}명을 찾았습니다.`);
                } catch (error) {
                    console.error("Error:", error);
                    alert("분석 중 오류가 발생했습니다. 개발자 도구(F12)의 콘솔을 확인해주세요.");
                } finally {
                    setLoading(false);
                    setLoadingMsg("");
                }
            };

            const resetList = () => {
                if(confirm("결과를 초기화할까요?")) setScannedList([]);
            };

            return (
                <div className="max-w-md mx-auto p-4 min-h-screen">
                    <header className="flex justify-between items-center mb-6 py-4 border-b border-slate-700">
                        <h1 className="text-xl font-bold text-blue-400">WOS Tracker</h1>
                        <button onClick={() => setView(view === 'main' ? 'manage' : 'main')} className="bg-slate-800 px-3 py-1 rounded-lg text-sm hover:bg-slate-700 transition">
                            {view === 'main' ? '명단 관리' : '홈으로'}
                        </button>
                    </header>

                    {loading && (
                        <div className="fixed inset-0 bg-black/80 flex flex-col items-center justify-center z-50 p-6 text-center">
                            <div className="loading-spinner mb-4"></div>
                            <p className="text-lg font-medium">{loadingMsg}</p>
                            <p className="text-sm text-slate-400 mt-2">창을 닫지 마세요.</p>
                        </div>
                    )}

                    {view === 'main' ? (
                        <div className="space-y-4">
                            <div className="glass-card p-10 text-center rounded-3xl border-2 border-dashed border-slate-600 hover:border-blue-500 transition-colors cursor-pointer relative">
                                <input type="file" multiple onChange={handleFileUpload} className="absolute inset-0 opacity-0 cursor-pointer" id="fileInput" accept="image/*" />
                                <div className="text-4xl mb-2">📸</div>
                                <p className="font-bold">스크린샷 업로드</p>
                                <p className="text-xs text-slate-400 mt-1">여러 장 동시 선택 가능</p>
                            </div>
                            
                            <div className="glass-card rounded-2xl overflow-hidden">
                                <div className="p-4 bg-slate-800/50 flex justify-between items-center">
                                    <span className="font-bold">스캔 결과 <span className="text-blue-400 ml-1">{scannedList.length}</span></span>
                                    <button onClick={resetList} className="text-xs bg-red-900/30 text-red-400 px-2 py-1 rounded">초기화</button>
                                </div>
                                <div className="max-h-[400px] overflow-y-auto divide-y divide-slate-700">
                                    {scannedList.length === 0 ? (
                                        <div className="p-10 text-center text-slate-500 text-sm">업로드된 명단이 없습니다.</div>
                                    ) : (
                                        scannedList.map((p, i) => (
                                            <div key={i} className="flex justify-between p-4 items-center animate-fadeIn">
                                                <span className="font-medium">{p.name}</span>
                                                <span className={`text-[10px] px-2 py-1 rounded-full font-bold ${p.role === '미등록' ? 'bg-red-900/50 text-red-400' : 'bg-blue-900/50 text-blue-400'}`}>
                                                    {p.role}
                                                </span>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>

                            {scannedList.length > 0 && (
                                <button 
                                    onClick={() => {
                                        const text = scannedList.map(p => `${p.name} (${p.role})`).join('\n');
                                        navigator.clipboard.writeText(text);
                                        alert("클립보드에 복사되었습니다!");
                                    }}
                                    className="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold transition"
                                >
                                    결과 텍스트 복사
                                </button>
                            )}
                        </div>
                    ) : (
                        <div className="glass-card rounded-2xl overflow-hidden animate-slideUp">
                            <div className="p-4 bg-slate-800/50 font-bold text-orange-400 flex justify-between">
                                <span>마스터 명단</span>
                                <span>{masterList.length}명</span>
                            </div>
                            <div className="max-h-[500px] overflow-y-auto divide-y divide-slate-700">
                                {masterList.length === 0 ? (
                                    <div className="p-10 text-center text-slate-500">데이터를 불러오는 중이거나 명단이 비어있습니다.</div>
                                ) : (
                                    masterList.map((m, i) => (
                                        <div key={i} className="flex justify-between p-3 text-sm">
                                            <span className="font-bold">{m.name}</span>
                                            <span className="text-slate-500">{m.role}</span>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
