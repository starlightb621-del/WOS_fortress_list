<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOS Tracker Pro - Ultra</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background: radial-gradient(circle at top, #1e293b, #0f172a); color: #f1f5f9; }
        .logo-font { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .loading-bar { height: 4px; background: #3b82f6; width: 0%; transition: width 0.3s; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const CONFIG = {
            GAS_URL: "https://script.google.com/macros/s/AKfycbxM8qa36ZkYfNjHBDAcB9yQQHh7CESM4T5-B_n6pmHqGqxHiMyUxoH_igCrWHuKDU5m/exec",
            API_KEY: "AIzaSyCVgqua6AyL-IWFhO68gxRHb5JY8aJd8H4"
        };

        function App() {
            const [masterList, setMasterList] = useState([]);
            const [scannedList, setScannedList] = useState([]);
            const [loading, setLoading] = useState(false);
            const [msg, setMsg] = useState("");

            useEffect(() => {
                fetch(CONFIG.GAS_URL).then(r => r.json()).then(d => setMasterList(d)).catch(() => {});
            }, []);

            const analyzeImages = async (e) => {
                const files = Array.from(e.target.files);
                if (!files.length) return;

                setLoading(true);
                let results = [];

                try {
                    for (const file of files) {
                        setMsg("AI 엔진 가동 중...");
                        const reader = new FileReader();
                        const base64 = await new Promise(r => {
                            reader.onload = () => r(reader.result.split(',')[1]);
                            reader.readAsDataURL(file);
                        });

                        // [절대 주의] 주소에 v1beta가 들어갔는지 꼭 확인하세요!
                        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${CONFIG.API_KEY}`;

                        const response = await fetch(API_URL, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                contents: [{
                                    parts: [
                                        { text: "이미지에서 '[GOM]' 뒤에 있는 닉네임만 추출해줘. 특수문자는 빼고 글자만. JSON으로: {\"names\":[\"닉네임\"]}" },
                                        { inline_data: { mime_type: "image/jpeg", data: base64 } }
                                    ]
                                }]
                            })
                        });

                        if (!response.ok) throw new Error(`서버 응답 오류: ${response.status}`);
                        
                        const data = await response.json();
                        const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                        const json = JSON.parse(text.match(/\{.*\}/s)[0]);
                        if (json.names) results = [...results, ...json.names];
                    }

                    const unique = [...new Set(results.map(n => n.trim()))];
                    const matched = unique.map(name => {
                        const m = masterList.find(ml => name.includes(ml.name) || ml.name.includes(name));
                        return m ? { ...m } : { name, role: "미등록" };
                    });

                    setScannedList(matched);
                    fetch(CONFIG.GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ data: matched }) });
                    alert(`${matched.length}명 인식 성공!`);

                } catch (err) {
                    console.error(err);
                    alert("오류 발생! 개발자 도구의 Console을 확인해주세요.");
                } finally {
                    setLoading(false);
                    setMsg("");
                }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen p-6">
                    <header className="text-center py-8">
                        <h1 className="logo-font text-3xl text-blue-500 tracking-tighter">WOS TRACKER</h1>
                        <p className="text-[10px] text-slate-500 tracking-widest mt-1 uppercase">Fortress Support System</p>
                    </header>

                    <div className="glass rounded-3xl p-8 text-center mb-6 relative overflow-hidden group">
                        <input type="file" multiple onChange={analyzeImages} className="absolute inset-0 opacity-0 cursor-pointer z-10" />
                        <div className="text-5xl mb-3 group-hover:scale-110 transition-transform">📷</div>
                        <p className="font-bold text-slate-300">스크린샷 업로드</p>
                        <p className="text-xs text-slate-500 mt-1 italic">여기를 눌러 사진을 선택하세요</p>
                    </div>

                    {loading && (
                        <div className="mb-6 text-center animate-pulse">
                            <div className="w-full bg-slate-800 rounded-full h-1 mb-2">
                                <div className="loading-bar w-2/3 rounded-full"></div>
                            </div>
                            <p className="text-[10px] text-blue-400 font-bold uppercase">{msg}</p>
                        </div>
                    )}

                    <div className="glass rounded-2xl overflow-hidden shadow-xl">
                        <div className="p-4 bg-white/5 border-b border-white/5 flex justify-between">
                            <span className="text-xs font-bold uppercase tracking-widest text-slate-400">Detected Members</span>
                            <span className="text-xs text-blue-500 font-bold">{scannedList.length}</span>
                        </div>
                        <div className="max-h-[350px] overflow-y-auto divide-y divide-white/5">
                            {scannedList.length === 0 ? (
                                <p className="p-12 text-center text-slate-600 text-sm italic">분석 결과가 여기에 표시됩니다.</p>
                            ) : (
                                scannedList.map((p, i) => (
                                    <div key={i} className="flex justify-between items-center p-4 hover:bg-white/5">
                                        <span className="text-sm font-medium">{p.name}</span>
                                        <span className={`text-[9px] px-2 py-1 rounded border ${p.role === '미등록' ? 'text-red-500 border-red-500/30 bg-red-500/5' : 'text-blue-400 border-blue-400/30 bg-blue-400/5'}`}>
                                            {p.role}
                                        </span>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
