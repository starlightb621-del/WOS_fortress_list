<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOS 명단관리 PRO</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes loading-bar { 0% { left: -40%; } 100% { left: 100%; } }
        .animate-loading-bar { position: relative; animation: loading-bar 2s infinite ease-in-out; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        body { background-color: #f0f9ff; margin: 0; padding: 0; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // --- [중요] 설정 정보를 다시 확인해주세요 ---
        const CONFIG = {
            GAS_URL: "https://script.google.com/macros/s/AKfycbxcCpXhhu8_ZDW0BaJEtzVkNvJ1K7biHOhdGkba3Eds4h5UDoXEvY9vToE5B_8tezD8/exec", // 여기에 본인의 GAS URL 입력
            API_KEY: "AIzaSyCFYQu5FBCEXhc0OLonW8EfaMwGMJLLvbo",    // 여기에 본인의 Gemini API 키 입력
            MODEL_NAME: "gemini-2.5-flash"      // 모델명 수정 완료
        };

        const Icon = ({ name, size = 18, className = "" }) => {
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const App = () => {
            const [view, setView] = useState('main'); 
            const [masterList, setMasterList] = useState([]);
            const [scannedData, setScannedData] = useState({ "12시": [], "18시": [], "21시": [] });
            const [activeTime, setActiveTime] = useState("12시");
            const [loading, setLoading] = useState(false);
            const [statusMsg, setStatusMsg] = useState("");
            const [isSyncing, setIsSyncing] = useState(false);
            const fileInputRef = useRef(null);

            useEffect(() => { 
                fetchMasterData();
                lucide.createIcons();
            }, []);

            useEffect(() => { lucide.createIcons(); }, [view, scannedData, loading, activeTime]);

            const fetchMasterData = async () => {
                setIsSyncing(true);
                try {
                    const response = await fetch(CONFIG.GAS_URL);
                    const data = await response.json();
                    setMasterList(data);
                } catch (e) { console.error("데이터 로드 실패"); }
                finally { setIsSyncing(false); }
            };

            const syncToSheet = async (updatedData) => {
                setIsSyncing(true);
                try {
                    await fetch(CONFIG.GAS_URL, { method: 'POST', body: JSON.stringify(updatedData) });
                    setStatusMsg("시트 동기화 완료");
                } catch (e) { setStatusMsg("동기화 실패"); }
                finally { setIsSyncing(false); setTimeout(() => setStatusMsg(""), 2000); }
            };

            // 유사도 계산 (오타 교정용)
            const getSimilarity = (s1, s2) => {
                const len1 = s1.length, len2 = s2.length;
                const matrix = Array(len1 + 1).fill(null).map(() => Array(len2 + 1).fill(null));
                for (let i = 0; i <= len1; i++) matrix[i][0] = i;
                for (let j = 0; j <= len2; j++) matrix[0][j] = j;
                for (let i = 1; i <= len1; i++) {
                    for (let j = 1; j <= len2; j++) {
                        const cost = s1[i - 1] === s2[j - 1] ? 0 : 1;
                        matrix[i][j] = Math.min(matrix[i - 1][j] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j - 1] + cost);
                    }
                }
                return 1 - matrix[len1][len2] / Math.max(len1, len2);
            };

            const runAI = async (e) => {
                const files = Array.from(e.target.files);
                if (!files.length) return;
                setLoading(true); setStatusMsg("AI가 명단을 읽고 있습니다...");
                
                let allExtractedNames = [];
                try {
                    for (let file of files) {
                        const base64Data = await new Promise(resolve => {
                            const reader = new FileReader();
                            reader.onload = () => resolve(reader.result.split(',')[1]);
                            reader.readAsDataURL(file);
                        });

                        // AI 호출 부분 개선
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${CONFIG.MODEL_NAME}:generateContent?key=${CONFIG.API_KEY}`, {
                            method: "POST", 
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ 
                                contents: [{ 
                                    parts: [
                                        { text: "이 이미지에서 사람의 닉네임만 모두 찾아서 다음 JSON 형식으로만 답해줘. 다른 말은 절대 하지마. 형식: {\"names\": [\"닉네임1\", \"닉네임2\"]}" },
                                        { inlineData: { mimeType: "image/jpeg", data: base64Data } }
                                    ]
                                }]
                            })
                        });
                        
                        const resData = await response.json();
                        
                        // 에러 핸들링 추가
                        if (resData.error) {
                            throw new Error(resData.error.message);
                        }

                        const aiText = resData.candidates?.[0]?.content?.parts?.[0]?.text || "";
                        const jsonMatch = aiText.match(/\{.*\}/s);
                        if (jsonMatch) {
                            const parsed = JSON.parse(jsonMatch[0]);
                            if (parsed.names) allExtractedNames = [...allExtractedNames, ...parsed.names];
                        }
                    }

                    // 마스터 명단과 대조 및 자동 보정
                    const processed = allExtractedNames.map(raw => {
                        const cleanRaw = raw.trim();
                        let best = { name: cleanRaw, role: "본캐", score: 0 };
                        
                        masterList.forEach(m => {
                            const s = getSimilarity(cleanRaw, m.name);
                            if (s > best.score && s > 0.5) { // 유사도 50% 이상이면 매칭
                                best = { ...m, score: s };
                            }
                        });
                        return best;
                    });

                    setScannedData(prev => {
                        const combined = [...prev[activeTime], ...processed];
                        // 이름 중복 제거
                        const unique = combined.filter((v, i, a) => a.findIndex(t => t.name === v.name) === i);
                        // 역할별 정렬 (운영진 최상단)
                        const roleOrder = { "운영진": 1, "본캐": 2, "부캐": 3 };
                        const sorted = unique.sort((a, b) => (roleOrder[a.role] || 9) - (roleOrder[b.role] || 9));
                        
                        const next = { ...prev, [activeTime]: sorted };
                        syncToSheet(next); // 시트 전송
                        return next;
                    });
                    setStatusMsg("추출 성공!");
                } catch (err) { 
                    console.error(err);
                    setStatusMsg("추출 실패: API 키나 모델명을 확인해주세요."); 
                }
                finally { setLoading(false); }
            };

            const copyToClipboard = () => {
                const list = scannedData[activeTime];
                if(list.length === 0) {
                    setStatusMsg("복사할 명단이 없습니다.");
                    return;
                }
                const text = `[${activeTime} 요새전 참여명단]\n` + list.map((p, i) => `${i+1}. ${p.name} (${p.role})`).join('\n');
                navigator.clipboard.writeText(text);
                setStatusMsg("클립보드 복사 완료!");
                setTimeout(() => setStatusMsg(""), 2000);
            };

            // 관리자 뷰
            if (view === 'admin') {
                return (
                    <div className="min-h-screen bg-white p-6 flex flex-col">
                        <header className="flex items-center justify-between mb-8">
                            <button onClick={() => setView('main')} className="p-2 text-slate-500 hover:bg-slate-100 rounded-full transition-colors"><Icon name="chevron-left" size={24}/></button>
                            <h2 className="text-xl font-black text-slate-900">마스터 명단 조회</h2>
                            <div className="w-10"></div>
                        </header>
                        <div className="flex-1 overflow-y-auto space-y-2 custom-scroll px-2">
                            {masterList.map((m, i) => (
                                <div key={i} className="flex justify-between items-center p-4 bg-slate-50 rounded-2xl border border-slate-100 shadow-sm">
                                    <span className="font-bold text-slate-700">{m.name}</span>
                                    <span className={`text-[10px] font-black px-2 py-1 rounded-md ${m.role === '운영진' ? 'bg-amber-100 text-amber-600' : 'bg-blue-100 text-blue-600'}`}>{m.role}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col items-center p-4 relative overflow-x-hidden">
                    {/* 배경 효과 */}
                    <div className="fixed inset-0 pointer-events-none">
                        <div className="absolute top-[-10%] right-[-10%] w-[70%] h-[60%] bg-blue-200/30 blur-[120px] rounded-full" />
                        <div className="absolute bottom-[-5%] left-[-5%] w-[50%] h-[50%] bg-sky-100/50 blur-[100px] rounded-full" />
                    </div>

                    <header className="w-full max-w-lg flex flex-col items-center mb-6 relative z-10">
                        <div className="flex items-center gap-2 px-4 py-1 rounded-full bg-white/80 border border-blue-200 shadow-sm mb-4">
                            <div className={`w-2 h-2 rounded-full ${isSyncing || loading ? 'bg-amber-400 animate-pulse' : 'bg-blue-500 shadow-sm'}`} />
                            <span className="text-[10px] font-black text-blue-600 tracking-widest uppercase">
                                {isSyncing ? '동기화 중...' : '데이터 연결됨'}
                            </span>
                        </div>
                        <h1 className="text-3xl font-black tracking-tight text-slate-900 leading-none">
                            WOS 요새쟁탈 <span className="text-blue-600">명단 PRO</span>
                        </h1>
                    </header>

                    <nav className="w-full max-w-lg flex bg-white/60 backdrop-blur-xl p-1.5 rounded-3xl border border-white shadow-sm mb-6 relative z-10">
                        {["12시", "18시", "21시"].map((time) => (
                            <button key={time} onClick={() => setActiveTime(time)} className={`flex-1 py-3 rounded-2xl text-sm font-black transition-all duration-300 flex items-center justify-center gap-2 ${activeTime === time ? "bg-gradient-to-br from-blue-600 to-sky-500 text-white shadow-lg" : "text-slate-400 hover:text-slate-600"}`}>
                                <Icon name="clock" size={16} /> {time}
                            </button>
                        ))}
                    </nav>

                    <main className="w-full max-w-lg space-y-6 relative z-10">
                        <div onClick={() => fileInputRef.current.click()} className="group bg-white/70 backdrop-blur-2xl rounded-[2rem] border border-white shadow-xl p-8 flex flex-col items-center cursor-pointer hover:shadow-2xl transition-all">
                            <input type="file" ref={fileInputRef} multiple onChange={runAI} className="hidden" />
                            <div className="w-16 h-16 bg-gradient-to-tr from-blue-500 to-sky-300 rounded-2xl flex items-center justify-center mb-4 shadow-lg group-hover:scale-110 transition-transform">
                                {loading ? <Icon name="refresh-cw" className="text-white animate-spin" /> : <Icon name="camera" className="text-white" />}
                            </div>
                            <h2 className="text-lg font-black text-slate-800">스크린샷 추가 스캔</h2>
                            <p className="text-xs text-slate-400 mt-1 font-bold">사진 여러 장을 한 번에 올릴 수 있습니다</p>
                            {loading && (
                                <div className="w-full mt-6 h-1.5 bg-blue-50 rounded-full overflow-hidden">
                                    <div className="h-full bg-blue-500 animate-loading-bar" style={{ width: '40%' }} />
                                </div>
                            )}
                        </div>

                        <div className="bg-white/80 backdrop-blur-2xl rounded-[2rem] border border-white shadow-xl overflow-hidden">
                            <div className="p-5 border-b border-blue-50 flex justify-between items-center bg-blue-50/20">
                                <div className="flex items-center gap-2">
                                    <Icon name="database" size={16} className="text-blue-500" />
                                    <span className="text-xs font-black text-slate-700 uppercase tracking-wider">추출 결과 ({scannedData[activeTime].length}명)</span>
                                </div>
                                {statusMsg && <div className="text-[10px] font-bold text-blue-600 flex items-center gap-1 animate-pulse"><Icon name="check-circle-2" size={12}/> {statusMsg}</div>}
                            </div>

                            <div className="max-h-[350px] overflow-y-auto px-4 py-2 custom-scroll bg-white/30">
                                {scannedData[activeTime].length === 0 ? (
                                    <div className="py-20 flex flex-col items-center justify-center opacity-20">
                                        <Icon name="shield-check" size={48} />
                                        <p className="text-xs mt-3 font-black tracking-widest uppercase">명단이 비어있습니다</p>
                                    </div>
                                ) : (
                                    <div className="space-y-2 py-2">
                                        {scannedData[activeTime].map((p, i) => (
                                            <div key={i} className="flex items-center justify-between p-4 bg-white border border-blue-50 rounded-2xl shadow-sm hover:border-blue-200 transition-colors">
                                                <div className="flex items-center gap-4">
                                                    <span className="text-[10px] font-black text-blue-300 w-4">{i + 1}</span>
                                                    <span className="text-sm font-black text-slate-800">{p.name}</span>
                                                </div>
                                                <div className="flex items-center gap-3">
                                                    <span className={`text-[10px] font-black px-3 py-1 rounded-full border ${p.role === '운영진' ? 'bg-amber-50 border-amber-200 text-amber-600' : 'bg-blue-50 border-blue-200 text-blue-600'}`}>{p.role}</span>
                                                    <button onClick={() => {
                                                        const filtered = scannedData[activeTime].filter((_, idx) => idx !== i);
                                                        const next = {...scannedData, [activeTime]: filtered};
                                                        setScannedData(next); syncToSheet(next);
                                                    }} className="text-slate-300 hover:text-rose-500 transition-colors"><Icon name="trash-2" size={16}/></button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            <div className="p-5 bg-blue-50/20 border-t border-blue-50 space-y-4">
                                <button onClick={copyToClipboard} className="w-full py-4 bg-gradient-to-r from-blue-600 to-sky-500 hover:from-blue-500 hover:to-sky-400 text-white rounded-2xl flex items-center justify-center gap-2 shadow-lg active:scale-95 transition-all font-black text-lg">
                                    <Icon name="copy" size={20} /> 명단 복사하기
                                </button>
                                <div onClick={() => setView('admin')} className="flex items-center justify-center gap-1.5 text-blue-400 hover:text-blue-600 cursor-pointer transition-colors group">
                                    <Icon name="settings" size={14} className="group-hover:rotate-45 transition-transform" />
                                    <span className="text-[11px] font-black uppercase tracking-wider">마스터 명단 확인</span>
                                </div>
                            </div>
                        </div>
                    </main>

                    <footer className="mt-auto py-10 opacity-30 text-center">
                        <p className="text-[10px] font-black tracking-[0.2em] text-blue-900 uppercase">1953 GOM ALLIANCE PRO created by PANDA</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
