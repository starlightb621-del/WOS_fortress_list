<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOS 요새쟁탈 명단 PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { 
            font-family: 'Pretendard', sans-serif; 
            background: linear-gradient(180deg, #EBF4FF 0%, #FFFFFF 100%);
        }
        .card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }
        .tab-active {
            background: linear-gradient(90deg, #3B82F6 0%, #2563EB 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }
        .btn-gradient {
            background: linear-gradient(90deg, #3B82F6 0%, #0EA5E9 100%);
            transition: all 0.3s ease;
        }
        .btn-gradient:hover { opacity: 0.9; transform: translateY(-1px); }
        .member-list::-webkit-scrollbar { width: 6px; }
        .member-list::-webkit-scrollbar-thumb { background: #E2E8F0; border-radius: 3px; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-8">

    <div class="flex items-center space-x-2 bg-blue-50 px-4 py-1.5 rounded-full mb-6 border border-blue-100 shadow-sm">
        <div class="w-2 h-2 bg-blue-500 rounded-full animate-pulse"></div>
        <span class="text-blue-600 text-xs font-bold uppercase tracking-wider">Cloud Connected</span>
    </div>

    <h1 class="text-4xl font-black text-gray-900 mb-8 tracking-tight">
        WOS 요새쟁탈 <span class="text-blue-600">명단 PRO</span>
    </h1>

    <div class="w-full max-w-lg space-y-6">
        <div class="card p-2 flex space-x-1">
            <button onclick="setTab('12시')" id="tab-12시" class="flex-1 py-3 rounded-2xl text-sm font-bold transition-all tab-active">12시</button>
            <button onclick="setTab('18시')" id="tab-18시" class="flex-1 py-3 rounded-2xl text-sm font-bold text-gray-400 hover:bg-gray-100 transition-all">18시</button>
            <button onclick="setTab('21시')" id="tab-21시" class="flex-1 py-3 rounded-2xl text-sm font-bold text-gray-400 hover:bg-gray-100 transition-all">21시</button>
        </div>

        <div class="card p-6 space-y-4">
            <div class="flex space-x-2">
                <input type="text" id="manualInput" 
                    class="flex-1 bg-gray-50 border-none rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-400 outline-none"
                    placeholder="닉네임 직접 입력...">
                <button onclick="addManualMember()" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold text-sm hover:bg-blue-700 transition">추가</button>
            </div>
            
            <label for="ocrUpload" class="cursor-pointer block">
                <div class="w-full border-2 border-dashed border-blue-200 rounded-2xl p-4 flex items-center justify-center space-x-2 text-blue-500 bg-blue-50 hover:bg-blue-100 transition">
                    <i class="fa-solid fa-camera"></i>
                    <span id="ocrStatus" class="text-sm font-bold">스샷 여러장 스캔 (자동압축)</span>
                </div>
                <input type="file" id="ocrUpload" class="hidden" accept="image/*" multiple onchange="handleOCR(event)">
            </label>
        </div>

        <div class="card flex flex-col overflow-hidden min-h-[400px]">
            <div class="p-6 border-b border-gray-50 flex justify-between items-center">
                <h2 class="font-bold text-gray-700 text-sm">참여 명단 (<span id="memberCount">0</span>명)</h2>
                <button onclick="clearList()" class="text-gray-400 hover:text-red-500 transition">
                    <i class="fa-solid fa-rotate-right text-xs"></i>
                </button>
            </div>

            <div id="memberList" class="flex-1 overflow-y-auto max-h-[350px] p-6 member-list">
                </div>

            <div class="p-6 pt-0">
                <button onclick="copyToClipboard()" class="w-full btn-gradient text-white py-4 rounded-2xl font-bold flex items-center justify-center space-x-2 shadow-lg">
                    <i class="fa-regular fa-copy"></i>
                    <span>명단 복사하기</span>
                </button>
                <div class="mt-4 flex justify-center">
                    <button onclick="window.location.href='/master'" class="text-xs text-gray-400 font-medium hover:text-blue-500 flex items-center space-x-1">
                        <i class="fa-solid fa-gear"></i>
                        <span>마스터 명단 확인</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-10 bg-gray-900 text-white px-6 py-3 rounded-full text-sm font-bold opacity-0 transition-all pointer-events-none z-50"></div>

    <script>
        let currentTab = '12시';
        let membersByTime = { '12시': [], '18시': [], '21시': [] };

        function setTab(time) {
            currentTab = time;
            document.querySelectorAll('[id^="tab-"]').forEach(btn => {
                btn.classList.remove('tab-active');
                btn.classList.add('text-gray-400', 'hover:bg-gray-100');
            });
            document.getElementById(`tab-${time}`).classList.add('tab-active');
            renderList();
        }

        // 이미지 압축 함수: 네트워크 에러 방지용
        async function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1200; // 가로 최대 1200px로 제한
                        let width = img.width;
                        let height = img.height;

                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        // 품질 0.7로 압축하여 용량 축소
                        resolve(canvas.toDataURL('image/jpeg', 0.7).split(',')[1]);
                    };
                };
            });
        }

        async function handleOCR(event) {
            const files = Array.from(event.target.files);
            if (files.length === 0) return;

            const statusText = document.getElementById('ocrStatus');
            const originalText = statusText.textContent;
            statusText.textContent = `${files.length}장 분석 중... 잠시만 기다려주세요.`;

            try {
                // 모든 이미지를 압축 및 Base64 변환
                const compressedImages = await Promise.all(files.map(file => compressImage(file)));

                const response = await fetch('/api/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ images: compressedImages })
                });

                if (!response.ok) throw new Error('서버 응답 오류');

                const data = await response.json();
                if (data.members) {
                    data.members.forEach(newMember => {
                        if (!membersByTime[currentTab].some(m => m.name === newMember.name)) {
                            membersByTime[currentTab].push(newMember);
                        }
                    });
                    renderList();
                    showToast(`${data.members.length}명의 연맹원을 인식했습니다.`);
                }
            } catch (err) {
                console.error(err);
                showToast("분석 실패: 사진 용량을 줄이거나 다시 시도해 주세요.");
            } finally {
                statusText.textContent = originalText;
                event.target.value = '';
            }
        }

        function renderList() {
            const listEl = document.getElementById('memberList');
            const countEl = document.getElementById('memberCount');
            const currentMembers = membersByTime[currentTab];
            listEl.innerHTML = '';
            countEl.textContent = currentMembers.length;

            if (currentMembers.length === 0) {
                listEl.innerHTML = '<div class="h-full flex flex-col items-center justify-center py-10 opacity-40"><p class="text-sm font-medium text-gray-500">데이터가 없습니다</p></div>';
                return;
            }

            currentMembers.forEach((m, idx) => {
                const item = document.createElement('div');
                item.className = "flex items-center justify-between mb-3 p-3 bg-gray-50 rounded-xl fade-in shadow-sm";
                item.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="w-6 h-6 flex items-center justify-center bg-white rounded-lg text-[10px] font-bold text-gray-400 border border-gray-100">${idx + 1}</span>
                        <div>
                            <p class="text-sm font-bold text-gray-800">${m.name}</p>
                            <p class="text-[10px] text-blue-500 font-bold uppercase tracking-tight">${m.role}</p>
                        </div>
                    </div>
                    <button onclick="removeMember(${idx})" class="text-gray-300 hover:text-red-500 transition px-2"><i class="fa-solid fa-xmark"></i></button>`;
                listEl.appendChild(item);
            });
        }

        function addManualMember() {
            const input = document.getElementById('manualInput');
            const name = input.value.trim();
            if (!name) return;
            if (membersByTime[currentTab].some(m => m.name === name)) {
                showToast("이미 등록된 이름입니다.");
                return;
            }
            membersByTime[currentTab].push({ name: name, role: "직접추가" });
            input.value = '';
            renderList();
        }

        function removeMember(idx) {
            membersByTime[currentTab].splice(idx, 1);
            renderList();
        }

        function clearList() {
            if(confirm("현재 명단을 비울까요?")) {
                membersByTime[currentTab] = [];
                renderList();
            }
        }

        function copyToClipboard() {
            const currentMembers = membersByTime[currentTab];
            if (currentMembers.length === 0) return showToast("복사할 내용이 없습니다.");
            let text = `📢 ${currentTab} 참여 명단 (총 ${currentMembers.length}명)\n\n`;
            text += currentMembers.map((m, i) => `${i + 1}. ${m.name} (${m.role})`).join('\n');
            navigator.clipboard.writeText(text).then(() => showToast("복사 완료!"));
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 2500);
        }

        window.onload = renderList;
    </script>
</body>
</html>
