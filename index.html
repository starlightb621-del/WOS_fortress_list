<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOS Fortress Tracker Pro</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .loading-spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const CONFIG = {
            GAS_URL: "https://script.google.com/macros/s/AKfycbxM8qa36ZkYfNjHBDAcB9yQQHh7CESM4T5-B_n6pmHqGqxHiMyUxoH_igCrWHuKDU5m/exec",
            GEMINI_API_KEY: "AIzaSyCVgqua6AyL-IWFhO68gxRHb5JY8aJd8H4" 
        };

        function App() {
            const [masterList, setMasterList] = useState([]);
            const [scannedList, setScannedList] = useState([]);
            const [loading, setLoading] = useState(false);
            const [loadingMsg, setLoadingMsg] = useState("");
            const [view, setView] = useState('main');

            const fetchMaster = () => {
                setLoadingMsg("마스터 명단 동기화 중...");
                fetch(CONFIG.GAS_URL)
                    .then(res => res.json())
                    .then(data => {
                        setMasterList(Array.isArray(data) ? data : []);
                        setLoadingMsg("");
                    })
                    .catch(err => setLoadingMsg("명단 로드 실패"));
            };

            useEffect(() => { fetchMaster(); }, []);

            const handleFileUpload = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                setLoading(true);
                let allExtractedNames = [];
                
                try {
                    for (let i = 0; i < files.length; i++) {
                        setLoadingMsg(`${i + 1}번 이미지 분석 중...`);
                        const reader = new FileReader();
                        const base64Promise = new Promise(resolve => {
                            reader.onload = () => resolve(reader.result.split(',')[1]);
                            reader.readAsDataURL(files[i]);
                        });
                        const base64Image = await base64Promise;

                        // 특수문자가 섞인 WOS 닉네임에 최적화된 프롬프트
                        const promptText = `이 이미지는 게임 '화이트아웃 서바이벌'의 연맹원 목록이야.
                        각 유저의 닉네임을 추출해줘.
                        주의사항:
                        1. [GOM] 같은 대괄호 안의 연맹 태그는 제외해.
                        2. 태그 바로 뒤에 나오는 닉네임을 정확히 추출해. 
                        3. 닉네임 뒤에 붙은 복잡한 그림 이모티콘이나 특수문자는 최대한 빼고 텍스트 위주로 추출해.
                        4. 결과는 반드시 JSON 형식으로만 답해줘: {"names": ["닉네임1", "닉네임2"]}`;

                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${CONFIG.GEMINI_API_KEY}`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                contents: [{
                                    parts: [
                                        { text: promptText },
                                        { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                                    ]
                                }]
                            })
                        });

                        const result = await response.json();
                        const rawText = result.candidates?.[0]?.content?.parts?.[0]?.text || "";
                        const jsonMatch = rawText.match(/\{[\s\S]*\}/);
                        
                        if (jsonMatch) {
                            const parsed = JSON.parse(jsonMatch[0]);
                            if (parsed.names) allExtractedNames = [...allExtractedNames, ...parsed.names];
                        }
                    }

                    // 매칭 로직
                    const results = allExtractedNames.map(name => {
                        const cleanName = name.trim();
                        // 마스터 명단에 포함되어 있는지 확인 (부분 일치 허용으로 특수문자 대응)
                        const info = masterList.find(m => cleanName.includes(m.name.trim()) || m.name.trim().includes(cleanName));
                        return info ? { ...info } : { name: cleanName, role: "미등록", grade: "-" };
                    });

                    setScannedList(results);
                    
                    // GAS 저장 요청 (저장 기능이 필요 없다면 생략 가능)
                    fetch(CONFIG.GAS_URL, {
                        method: "POST",
                        mode: "no-cors",
                        body: JSON.stringify({ action: "saveLog", data: results })
                    });

                    alert(`${results.length}명의 데이터를 읽었습니다!`);
                } catch (error) {
                    console.error(error);
                    alert("분석 중 오류가 발생했습니다.");
                } finally {
                    setLoading(false);
                    setLoadingMsg("");
                }
            };

            return (
                <div className="max-w-md mx-auto p-4 min-h-screen">
                    <header className="flex justify-between items-center mb-6 py-4 border-b border-slate-700">
                        <h1 className="text-xl font-bold text-blue-400">WOS Tracker Pro</h1>
                        <button onClick={() => setView(view === 'main' ? 'manage' : 'main')} className="bg-slate-800 px-3 py-1 rounded-lg text-sm">
                            {view === 'main' ? '명단 관리' : '홈으로'}
                        </button>
                    </header>

                    {loading && (
                        <div className="fixed inset-0 bg-black/80 flex flex-col items-center justify-center z-50">
                            <div className="loading-spinner mb-4"></div>
                            <p>{loadingMsg}</p>
                        </div>
                    )}

                    {view === 'main' ? (
                        <div className="space-y-4">
                            <div className="glass-card p-10 text-center rounded-3xl border-2 border-dashed border-slate-600 relative">
                                <input type="file" multiple onChange={handleFileUpload} className="absolute inset-0 opacity-0 cursor-pointer" accept="image/*" />
                                <div className="text-4xl mb-2">📸</div>
                                <p className="font-bold">스크린샷 업로드</p>
                                <p className="text-xs text-slate-400 mt-1">집결 화면 스크린샷을 선택하세요</p>
                            </div>
                            
                            <div className="glass-card rounded-2xl overflow-hidden">
                                <div className="p-4 bg-slate-800/50 flex justify-between">
                                    <span className="font-bold">스캔 결과 ({scannedList.length})</span>
                                    <button onClick={() => setScannedList([])} className="text-xs text-slate-400">초기화</button>
                                </div>
                                <div className="max-h-[400px] overflow-y-auto divide-y divide-slate-700">
                                    {scannedList.map((p, i) => (
                                        <div key={i} className="flex justify-between p-4 items-center">
                                            <span className="text-sm font-medium">{p.name}</span>
                                            <span className={`text-[10px] px-2 py-0.5 rounded ${p.role === '미등록' ? 'bg-red-900/30 text-red-400' : 'bg-blue-900/30 text-blue-400'}`}>
                                                {p.role}
                                            </span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="glass-card rounded-2xl overflow-hidden">
                            <div className="p-4 bg-slate-800/50 font-bold text-orange-400">등록된 마스터 명단</div>
                            <div className="max-h-[500px] overflow-y-auto divide-y divide-slate-700">
                                {masterList.map((m, i) => (
                                    <div key={i} className="flex justify-between p-3 text-sm">
                                        <span>{m.name}</span>
                                        <span className="text-slate-500">{m.role}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
