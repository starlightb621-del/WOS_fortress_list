<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOS 명단관리 PRO</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // --- [백서 1번 수칙 준수: 최종 설정] ---
        const CONFIG = {
            GAS_URL: "https://script.google.com/macros/s/AKfycbcXcpXhhu8_ZDW0BaJetzVKnvJ1K7biHOhdGkba3Eds4h5UDOXEvY9vToE5B_8tezD8/exec", 
            API_KEY: "AIzaSyAgezV6j6tCs-7j39pA32FSVLgHy6rduFI", 
            MODEL_NAME: "gemini-2.5-flash"  // 백서 승인 모델 고정
        };

        // 아이콘 컴포넌트 (Fragment 보완)
        const Icon = ({ name, size = 18 }) => {
            const icons = {
                camera: <><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></>,
                trash: <><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></>,
                copy: <><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></>,
                check: <><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>
            };
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    {icons[name]}
                </svg>
            );
        };

        const App = () => {
            const [masterList, setMasterList] = useState([]);
            const [scannedData, setScannedData] = useState({ "12시": [], "18시": [], "21시": [] });
            const [activeTime, setActiveTime] = useState("12시");
            const [loading, setLoading] = useState(false);
            const [statusMsg, setStatusMsg] = useState("");
            const fileInputRef = useRef(null);

            useEffect(() => { fetchMasterData(); }, []);

            const fetchMasterData = async () => {
                try {
                    const response = await fetch(CONFIG.GAS_URL);
                    const data = await response.json();
                    setMasterList(data);
                } catch (e) { setStatusMsg("데이터 로드 실패"); }
            };

            const syncToSheet = async (updatedData) => {
                try {
                    // CORS 문제 해결을 위해 mode: 'no-cors' 대신 시트 권한 확인이 필요합니다.
                    await fetch(CONFIG.GAS_URL, {
                        method: 'POST',
                        mode: 'no-cors', // 임시 조치: 응답은 못받아도 데이터는 전송됨
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updatedData)
                    });
                    setStatusMsg("저장 완료!");
                } catch (e) { setStatusMsg("동기화 실패"); }
                finally { setTimeout(() => setStatusMsg(""), 2000); }
            };

            const runAI = async (e) => {
                const files = Array.from(e.target.files);
                if (!files.length) return;
                setLoading(true); setStatusMsg("2.5 엔진 분석 중...");
                
                try {
                    for (let file of files) {
                        const base64 = await new Promise(res => {
                            const reader = new FileReader();
                            reader.onload = () => res(reader.result.split(',')[1]);
                            reader.readAsDataURL(file);
                        });

                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${CONFIG.MODEL_NAME}:generateContent?key=${CONFIG.API_KEY}`, {
                            method: "POST", headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ contents: [{ parts: [
                                { text: "이미지에서 닉네임만 추출해서 JSON 형식을 줘: {\"names\": [\"닉네임1\"]}" },
                                { inlineData: { mimeType: "image/jpeg", data: base64 } }
                            ]}]})
                        });
                        const resData = await response.json();
                        const aiText = resData.candidates?.[0]?.content?.parts?.[0]?.text || "";
                        const jsonMatch = aiText.match(/\{.*\}/s);
                        if (jsonMatch) {
                            const parsed = JSON.parse(jsonMatch[0]);
                            const processed = parsed.names.map(name => {
                                const match = masterList.find(m => m.name === name.trim()) || { name: name.trim(), role: "미확인" };
                                return match;
                            });
                            setScannedData(prev => {
                                const next = { ...prev, [activeTime]: [...prev[activeTime], ...processed] };
                                syncToSheet(next);
                                return next;
                            });
                        }
                    }
                    setStatusMsg("분석 완료!");
                } catch (err) { setStatusMsg("2.5 엔진 오류"); }
                finally { setLoading(false); }
            };

            return (
                <div className="max-w-lg mx-auto p-4 flex flex-col min-h-screen">
                    <header className="text-center py-6">
                        <h1 className="text-2xl font-black text-slate-800">WOS 명단 PRO <span className="text-blue-500 text-sm">2.5 Engine</span></h1>
                    </header>

                    <nav className="flex bg-white p-1 rounded-2xl shadow-sm mb-6">
                        {["12시", "18시", "21시"].map(t => (
                            <button key={t} onClick={() => setActiveTime(t)} className={`flex-1 py-3 rounded-xl text-sm font-bold ${activeTime === t ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>{t}</button>
                        ))}
                    </nav>

                    <div onClick={() => fileInputRef.current.click()} className="bg-white rounded-3xl p-10 flex flex-col items-center border-2 border-dashed border-blue-200 cursor-pointer mb-6">
                        <input type="file" ref={fileInputRef} multiple onChange={runAI} className="hidden" />
                        <div className="bg-blue-600 p-4 rounded-full text-white mb-4">
                            {loading ? <div className="animate-spin h-6 w-6 border-2 border-white border-t-transparent rounded-full"/> : <Icon name="camera" size={28}/>}
                        </div>
                        <p className="font-bold text-slate-700">스크린샷 추가 스캔</p>
                    </div>

                    <div className="flex-1 bg-white rounded-t-3xl shadow-xl p-6 overflow-y-auto">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="font-black text-slate-800 tracking-tighter uppercase">{activeTime} 참여 명단</h2>
                            {statusMsg && <span className="text-xs font-bold text-blue-500 animate-pulse">{statusMsg}</span>}
                        </div>
                        <div className="space-y-2">
                            {scannedData[activeTime].map((p, i) => (
                                <div key={i} className="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-100">
                                    <span className="text-sm font-bold">{p.name}</span>
                                    <span className="text-[10px] bg-white px-2 py-1 rounded-lg border border-slate-200">{p.role}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
